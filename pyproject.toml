[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "premise"
authors = [
  { name="Romain Sacchi", email="romain.sacchi@psi.ch" },
  { name="Alois Dirnaichner", email="dirnaichner@pik-potsdam.de" },
  { name="Chris Mutel", email="cmutel@gmail.com" },
  { name="Alvaro Hahn Menacho", email="alvaro.hahn-menacho@psi.ch" }
]
maintainers = [
  { name="Romain Sacchi", email="romain.sacchi@psi.ch" }
]
description = "Coupling IAM output to ecoinvent LCA database ecoinvent for prospective LCA"
readme = "README.md"
license = "BSD-3-Clause"
dynamic = ["dependencies", "version"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.12"

[project.urls]
source = "https://github.com/polca/premise"
homepage = "https://github.com/polca/premise"
tracker = "https://github.com/polca/premise/issues"

[project.optional-dependencies]

docs = [
    "sphinx>=8,<9",
    "sphinx-rtd-theme>=3,<4",
]
bw25 = [
    "bw2calc>=2.4",
    "bw2data>=4.5",
    "bw2io>=0.9.11",
    "bw_processing>=1.0",
]

# Legacy Brightway uses NumPy APIs removed in NumPy 2. Keep these constraints
# in its extra so they do not restrict modern Brightway installations.
bw2 = [
    "bw2calc==1.8.2",
    "bw2data==3.6.6",
    "bw2io==0.8.12",
    "numpy<2",
    "scipy<1.14",
    "pandas<3",
    "pyarrow<26",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["premise*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
version = {attr = "premise.__version__"}

[tool.pytest.ini_options]
markers = [
    # marks tests that require ecoinvent (to be disabled on Travis)
    "ecoinvent",
    "serial"
]
norecursedirs = [
    "dist",
    "build",
    ".tox"
]
testpaths = ["tests/*.py"]

[tool.flake8]
# Some sane defaults for the code style checker flake8
max_line_length = 88
extend_ignore = ["E203", "W503"]
# ^  Black-compatible
#    E203 and W503 have edge cases handled by black
exclude = [
    ".tox",
    "build",
    "dist",
    ".eggs",
    "docs/conf.py",
]

[tool.setuptools.package-data]
premise = [
    "data/**/*.txt",
    "data/**/*.csv",
    "data/**/*.json",
    "data/**/*.yml",
    "data/**/*.yaml",
    "data/**/*.xlsx",
    "data/**/*.pickle",
    "iam_variables_mapping/*.yaml",
    "iam_variables_mapping/*.xlsx",
    "iam_variables_mapping/topologies/*.json",
    "fuels/*.py",
]

[tool.setuptools.exclude-package-data]
premise = ["data/iam_output_files/*", "data/solar/pv_2026_gwp100_reference.csv", "data/metals/ecoinvent_factors.csv"]
