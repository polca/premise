<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif" fill="#203645"><title id="title">Clinker and cement supply</title><desc id="description">No cement mix: leave the sector unchanged Prepare clinker and capture routes: Regional source activities and mapped CCS modules; Set energy target and adjust coal: 3.4 MJ/kg basis; bounds or fixed efficient-kiln target; Set pollutants and capture flows: Route-specific ammonia, NOx, mercury, sulfur and CO2; Build clinker and cement markets: Regional clinker supplies cement production; Relink consumers and check: Retain source cement composition</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#59768a"/></marker></defs><rect x="20" y="16" width="600" height="66" rx="9" fill="#fff9e9" stroke="#b9974f" stroke-width="1.5"/><text x="38" y="47" font-size="18" font-weight="600">Data availability</text><text x="38" y="68" font-size="15" fill="#425466">No cement mix: leave the sector unchanged</text><rect x="20" y="98" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="124" r="12" fill="#245b78"/><text x="44" y="129" text-anchor="middle" font-size="13" fill="white">1</text><text x="66" y="129" font-size="18" font-weight="600">Prepare clinker and capture routes</text><text x="66" y="150" font-size="15" fill="#425466">Regional source activities and mapped CCS modules</text><path d="M320 164 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="200" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="226" r="12" fill="#245b78"/><text x="44" y="231" text-anchor="middle" font-size="13" fill="white">2</text><text x="66" y="231" font-size="18" font-weight="600">Set energy target and adjust coal</text><text x="66" y="252" font-size="15" fill="#425466">3.4 MJ/kg basis; bounds or fixed efficient-kiln target</text><path d="M320 266 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="302" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="328" r="12" fill="#245b78"/><text x="44" y="333" text-anchor="middle" font-size="13" fill="white">3</text><text x="66" y="333" font-size="18" font-weight="600">Set pollutants and capture flows</text><text x="66" y="354" font-size="15" fill="#425466">Route-specific ammonia, NOx, mercury, sulfur and CO2</text><path d="M320 368 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="404" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="430" r="12" fill="#245b78"/><text x="44" y="435" text-anchor="middle" font-size="13" fill="white">4</text><text x="66" y="435" font-size="18" font-weight="600">Build clinker and cement markets</text><text x="66" y="456" font-size="15" fill="#425466">Regional clinker supplies cement production</text><path d="M320 470 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="506" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="532" r="12" fill="#245b78"/><text x="44" y="537" text-anchor="middle" font-size="13" fill="white">5</text><text x="66" y="537" font-size="18" font-weight="600">Relink consumers and check</text><text x="66" y="558" font-size="15" fill="#425466">Retain source cement composition</text></svg>
