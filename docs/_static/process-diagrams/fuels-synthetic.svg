<svg xmlns="http://www.w3.org/2000/svg" width="640" height="506" viewBox="0 0 640 506" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif" fill="#203645"><title id="title">Synthetic-fuel supply chains</title><desc id="description">No fuel blend data: skip the fuels transformation Regionalize mapped synthesis routes: Synthetic products, methanol and supporting activities; Connect hydrogen and CO2 supplies: Use the selected inventory routes and regional suppliers; Construct mapped liquid or gas markets: Production shares and heating-value conversion; Relink consuming activities: Keep synthesis coefficients unless a separate operation changes them</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#59768a"/></marker></defs><rect x="20" y="16" width="600" height="66" rx="9" fill="#fff9e9" stroke="#b9974f" stroke-width="1.5"/><text x="38" y="47" font-size="18" font-weight="600">Data availability</text><text x="38" y="68" font-size="15" fill="#425466">No fuel blend data: skip the fuels transformation</text><rect x="20" y="98" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="124" r="12" fill="#245b78"/><text x="44" y="129" text-anchor="middle" font-size="13" fill="white">1</text><text x="66" y="129" font-size="18" font-weight="600">Regionalize mapped synthesis routes</text><text x="66" y="150" font-size="15" fill="#425466">Synthetic products, methanol and supporting activities</text><path d="M320 164 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="200" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="226" r="12" fill="#245b78"/><text x="44" y="231" text-anchor="middle" font-size="13" fill="white">2</text><text x="66" y="231" font-size="18" font-weight="600">Connect hydrogen and CO2 supplies</text><text x="66" y="252" font-size="15" fill="#425466">Use the selected inventory routes and regional suppliers</text><path d="M320 266 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="302" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="328" r="12" fill="#245b78"/><text x="44" y="333" text-anchor="middle" font-size="13" fill="white">3</text><text x="66" y="333" font-size="18" font-weight="600">Construct mapped liquid or gas markets</text><text x="66" y="354" font-size="15" fill="#425466">Production shares and heating-value conversion</text><path d="M320 368 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="404" width="600" height="86" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="430" r="12" fill="#245b78"/><text x="44" y="435" text-anchor="middle" font-size="13" fill="white">4</text><text x="66" y="435" font-size="18" font-weight="600">Relink consuming activities</text><text x="66" y="456" font-size="15" fill="#425466">Keep synthesis coefficients unless a separate operation changes</text><text x="66" y="476" font-size="15" fill="#425466">them</text></svg>
