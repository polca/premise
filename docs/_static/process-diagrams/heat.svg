<svg xmlns="http://www.w3.org/2000/svg" width="640" height="648" viewBox="0 0 640 648" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif" fill="#203645"><title id="title">Delivered-heat markets</title><desc id="description">No heat layers: unchanged; a partially reported mapped layer is an error Read heat layers: Buildings, industry and secondary supply; Prepare suppliers and convert volumes: Regionalize; adjust fuel CO2; convert final energy to delivered heat; Build available heat markets: Normalize shares; use explicit residuals or source-mix fallbacks; Redirect heat consumers: Route buildings and industry to the corresponding layers; Relink energy inputs and check: Relink suppliers, check cycles and bound matched cogeneration efficiency</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#59768a"/></marker></defs><rect x="20" y="16" width="600" height="86" rx="9" fill="#fff9e9" stroke="#b9974f" stroke-width="1.5"/><text x="38" y="47" font-size="18" font-weight="600">Data availability</text><text x="38" y="68" font-size="15" fill="#425466">No heat layers: unchanged; a partially reported mapped layer is</text><text x="38" y="88" font-size="15" fill="#425466">an error</text><rect x="20" y="118" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="144" r="12" fill="#245b78"/><text x="44" y="149" text-anchor="middle" font-size="13" fill="white">1</text><text x="66" y="149" font-size="18" font-weight="600">Read heat layers</text><text x="66" y="170" font-size="15" fill="#425466">Buildings, industry and secondary supply</text><path d="M320 184 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="220" width="600" height="86" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="246" r="12" fill="#245b78"/><text x="44" y="251" text-anchor="middle" font-size="13" fill="white">2</text><text x="66" y="251" font-size="18" font-weight="600">Prepare suppliers and convert volumes</text><text x="66" y="272" font-size="15" fill="#425466">Regionalize; adjust fuel CO2; convert final energy to delivered</text><text x="66" y="292" font-size="15" fill="#425466">heat</text><path d="M320 306 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="342" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="368" r="12" fill="#245b78"/><text x="44" y="373" text-anchor="middle" font-size="13" fill="white">3</text><text x="66" y="373" font-size="18" font-weight="600">Build available heat markets</text><text x="66" y="394" font-size="15" fill="#425466">Normalize shares; use explicit residuals or source-mix fallbacks</text><path d="M320 408 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="444" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="470" r="12" fill="#245b78"/><text x="44" y="475" text-anchor="middle" font-size="13" fill="white">4</text><text x="66" y="475" font-size="18" font-weight="600">Redirect heat consumers</text><text x="66" y="496" font-size="15" fill="#425466">Route buildings and industry to the corresponding layers</text><path d="M320 510 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="546" width="600" height="86" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="572" r="12" fill="#245b78"/><text x="44" y="577" text-anchor="middle" font-size="13" fill="white">5</text><text x="66" y="577" font-size="18" font-weight="600">Relink energy inputs and check</text><text x="66" y="598" font-size="15" fill="#425466">Relink suppliers, check cycles and bound matched cogeneration</text><text x="66" y="618" font-size="15" fill="#425466">efficiency</text></svg>
