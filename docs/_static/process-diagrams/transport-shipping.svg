<svg xmlns="http://www.w3.org/2000/svg" width="640" height="424" viewBox="0 0 640 424" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif" fill="#203645"><title id="title">Shipping transformation</title><desc id="description"> Regionalize mapped transport activities: Use mode-specific inventories, even without fleet data; Apply available efficiency factors: Selected energy inputs and all biosphere exchanges; If fleet data exist: build service markets: Mapped production volumes and system-model weighting; Redirect eligible freight consumers: Exact activity and tonne-kilometre matches; retain unresolved inputs</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#59768a"/></marker></defs><rect x="20" y="16" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="42" r="12" fill="#245b78"/><text x="44" y="47" text-anchor="middle" font-size="13" fill="white">1</text><text x="66" y="47" font-size="18" font-weight="600">Regionalize mapped transport activities</text><text x="66" y="68" font-size="15" fill="#425466">Use mode-specific inventories, even without fleet data</text><path d="M320 82 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="118" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="144" r="12" fill="#245b78"/><text x="44" y="149" text-anchor="middle" font-size="13" fill="white">2</text><text x="66" y="149" font-size="18" font-weight="600">Apply available efficiency factors</text><text x="66" y="170" font-size="15" fill="#425466">Selected energy inputs and all biosphere exchanges</text><path d="M320 184 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="220" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="246" r="12" fill="#245b78"/><text x="44" y="251" text-anchor="middle" font-size="13" fill="white">3</text><text x="66" y="251" font-size="18" font-weight="600">If fleet data exist: build service markets</text><text x="66" y="272" font-size="15" fill="#425466">Mapped production volumes and system-model weighting</text><path d="M320 286 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="322" width="600" height="86" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="348" r="12" fill="#245b78"/><text x="44" y="353" text-anchor="middle" font-size="13" fill="white">4</text><text x="66" y="353" font-size="18" font-weight="600">Redirect eligible freight consumers</text><text x="66" y="374" font-size="15" fill="#425466">Exact activity and tonne-kilometre matches; retain unresolved</text><text x="66" y="394" font-size="15" fill="#425466">inputs</text></svg>
