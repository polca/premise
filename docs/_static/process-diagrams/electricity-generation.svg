<svg xmlns="http://www.w3.org/2000/svg" width="640" height="486" viewBox="0 0 640 486" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif" fill="#203645"><title id="title">Electricity transformation</title><desc id="description">No electricity mix: leave the sector unchanged Prepare source activities: Missing routes, coal factors, PV area and reservoir-water flows; Regionalize generation and build markets: Create regional suppliers and the three voltage layers; Apply available IAM efficiencies: All technosphere and biosphere exchanges; production stays fixed; Relink consumers and check: Specialized technologies retain their own adjustment rules</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#59768a"/></marker></defs><rect x="20" y="16" width="600" height="66" rx="9" fill="#fff9e9" stroke="#b9974f" stroke-width="1.5"/><text x="38" y="47" font-size="18" font-weight="600">Data availability</text><text x="38" y="68" font-size="15" fill="#425466">No electricity mix: leave the sector unchanged</text><rect x="20" y="98" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="124" r="12" fill="#245b78"/><text x="44" y="129" text-anchor="middle" font-size="13" fill="white">1</text><text x="66" y="129" font-size="18" font-weight="600">Prepare source activities</text><text x="66" y="150" font-size="15" fill="#425466">Missing routes, coal factors, PV area and reservoir-water flows</text><path d="M320 164 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="200" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="226" r="12" fill="#245b78"/><text x="44" y="231" text-anchor="middle" font-size="13" fill="white">2</text><text x="66" y="231" font-size="18" font-weight="600">Regionalize generation and build markets</text><text x="66" y="252" font-size="15" fill="#425466">Create regional suppliers and the three voltage layers</text><path d="M320 266 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="302" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="328" r="12" fill="#245b78"/><text x="44" y="333" text-anchor="middle" font-size="13" fill="white">3</text><text x="66" y="333" font-size="18" font-weight="600">Apply available IAM efficiencies</text><text x="66" y="354" font-size="15" fill="#425466">All technosphere and biosphere exchanges; production stays fixed</text><path d="M320 368 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="404" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="430" r="12" fill="#245b78"/><text x="44" y="435" text-anchor="middle" font-size="13" fill="white">4</text><text x="66" y="435" font-size="18" font-weight="600">Relink consumers and check</text><text x="66" y="456" font-size="15" fill="#425466">Specialized technologies retain their own adjustment rules</text></svg>
