<svg xmlns="http://www.w3.org/2000/svg" width="640" height="546" viewBox="0 0 640 546" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif" fill="#203645"><title id="title">Photovoltaic inventory and scenario changes</title><desc id="description">No electricity mix: the scenario electricity/PV update is skipped Import the selected PV inventory: 2026 core for 3.12 cut-off; version-specific alternatives otherwise; Read external module-efficiency trajectory: Infer existing installation efficiency from capacity and area; Reduce area when efficiency increases: Panels and applicable area-dependent mounting, cleaning and recycling; Use country suppliers in electricity markets: Fixed country recipes and yields; prospective background suppliers</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#59768a"/></marker></defs><rect x="20" y="16" width="600" height="66" rx="9" fill="#fff9e9" stroke="#b9974f" stroke-width="1.5"/><text x="38" y="47" font-size="18" font-weight="600">Data availability</text><text x="38" y="68" font-size="15" fill="#425466">No electricity mix: the scenario electricity/PV update is skipped</text><rect x="20" y="98" width="600" height="86" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="124" r="12" fill="#245b78"/><text x="44" y="129" text-anchor="middle" font-size="13" fill="white">1</text><text x="66" y="129" font-size="18" font-weight="600">Import the selected PV inventory</text><text x="66" y="150" font-size="15" fill="#425466">2026 core for 3.12 cut-off; version-specific alternatives</text><text x="66" y="170" font-size="15" fill="#425466">otherwise</text><path d="M320 184 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="220" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="246" r="12" fill="#245b78"/><text x="44" y="251" text-anchor="middle" font-size="13" fill="white">2</text><text x="66" y="251" font-size="18" font-weight="600">Read external module-efficiency trajectory</text><text x="66" y="272" font-size="15" fill="#425466">Infer existing installation efficiency from capacity and area</text><path d="M320 286 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="322" width="600" height="86" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="348" r="12" fill="#245b78"/><text x="44" y="353" text-anchor="middle" font-size="13" fill="white">3</text><text x="66" y="353" font-size="18" font-weight="600">Reduce area when efficiency increases</text><text x="66" y="374" font-size="15" fill="#425466">Panels and applicable area-dependent mounting, cleaning and</text><text x="66" y="394" font-size="15" fill="#425466">recycling</text><path d="M320 408 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="444" width="600" height="86" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="470" r="12" fill="#245b78"/><text x="44" y="475" text-anchor="middle" font-size="13" fill="white">4</text><text x="66" y="475" font-size="18" font-weight="600">Use country suppliers in electricity markets</text><text x="66" y="496" font-size="15" fill="#425466">Fixed country recipes and yields; prospective background</text><text x="66" y="516" font-size="15" fill="#425466">suppliers</text></svg>
