gen route</text><text x="66" y="252" font-size="15" fill="#425466">Supporting-activity mapping in the fuels transformation</text><path d="M320 266 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="302" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="328" r="12" fill="#245b78"/><text x="44" y="333" text-anchor="middle" font-size="13" fill="white">3</text><text x="66" y="333" font-size="18" font-weight="600">Create regional variants and relink</text><text x="66" y="354" font-size="15" fill="#425466">Hydrogen and other available upstream suppliers</text><path d="M320 368 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="404" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="430" r="12" fill="#245b78"/><text x="44" y="435" text-anchor="middle" font-size="13" fill="white">4</text><text x="66" y="435" font-size="18" font-weight="600">Supply activities that request this route</text><text x="66" y="456" font-size="15" fill="#425466">No separate IAM ammonia-mix construction</text></svg>
