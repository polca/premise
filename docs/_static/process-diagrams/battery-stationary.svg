<svg xmlns="http://www.w3.org/2000/svg" width="640" height="506" viewBox="0 0 640 506" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif" fill="#203645"><title id="title">Stationary battery capacity</title><desc id="description">Neither battery scenario is available: leave batteries unchanged Read cell-density targets: External mean and uncertainty trajectories; hold endpoint years; Scale kilogram inputs in capacity markets: 2020 density / scenario-year density; Update available chemistry mixes: Interpolate shares; normalize positive supplier totals; Supply explicit capacity consumers: Installed capacity is distinct from lifetime electricity throughput</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#59768a"/></marker></defs><rect x="20" y="16" width="600" height="66" rx="9" fill="#fff9e9" stroke="#b9974f" stroke-width="1.5"/><text x="38" y="47" font-size="18" font-weight="600">Data availability</text><text x="38" y="68" font-size="15" fill="#425466">Neither battery scenario is available: leave batteries unchanged</text><rect x="20" y="98" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="124" r="12" fill="#245b78"/><text x="44" y="129" text-anchor="middle" font-size="13" fill="white">1</text><text x="66" y="129" font-size="18" font-weight="600">Read cell-density targets</text><text x="66" y="150" font-size="15" fill="#425466">External mean and uncertainty trajectories; hold endpoint years</text><path d="M320 164 v24" stroke="#59768a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="200" width="600" height="66" rx="9" fill="#f0f6fa" stroke="#96b2c4" stroke-width="1.5"/><circle cx="44" cy="226" r="12" fill="#245b78"/><text x="44" y="231" text-anchor="middle" font-size="13" fill="white">2</text><text x="66" y="231" font-size="18" font-weight