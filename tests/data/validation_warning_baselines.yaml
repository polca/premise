metadata:
  description: >-
    Reviewed unsuppressed validation-warning counts. A new rule or a count above
    the recorded value fails certification unless the exception is documented
    by a narrow version/system-model suppression.
  validation_ruleset_version: 9
cases:
  ecoinvent-3.12-cutoff-image-SSP2-M-2050:
    review:
      date: '2026-11-15'
      source_commit: b786854eacf7ffc4f6df5fa4aa9461bb5db6d237
      method: >-
        Full compact-backend no-write update of ecoinvent 3.12 cutoff with
        encrypted IMAGE SSP2-M data, year 2050, PYTHONHASHSEED=0. Reviewed the
        structured ruleset-9 certificate: zero errors and 344 unsuppressed
        current warnings. Reviewed all 75 preserved-resource cases: 40 have
        established upstream extraction/cutoff-secondary boundaries; nine
        non-metal inventories are outside correction scope. Seven unresolved
        supply boundaries and 19 uncertain product-content/co-mined cases
        remain warnings. All 75 decisions remain in scope coverage/provenance.
        All activity amounts and provider signatures remain unchanged across
        48531 activities and 1410226 exchanges. Other warning counts are unchanged.
      limitations: >-
        Counts record existing methodological and data limitations for this
        case only. Warnings remain visible; new rules or increased counts fail.
        The old zero-lead reference warning is no longer emitted. Native CNG
        uses approximate packaged fuel factors, not measured regional gas
        compositions or a future IAM blend. Unknown/mixed supplies remain
        unresolved. Germanium providers and unresolved extraction paths remain
        open limitations, not evidence of a validated physical balance.
    warning_rule_counts:
      LEGACY.CO2_EMISSIONS_POSSIBLY_INCORRECT: 90
      LEGACY.ELECTRICITY_EFFICIENCY_POSSIBLY_INCORRECT: 11
      # Aggregate diagnostics for 78 unverified-scope and 653 unsupported-year
      # material-rule applications. Source material amounts are preserved.
      LEGACY.METALS_MATERIAL_RULE_COMPONENT_SCOPE_UNVERIFIED: 1
      LEGACY.METALS_MATERIAL_RULE_YEAR_OUTSIDE_SUPPORT: 1
      # Market share evidence ends in 2030; do not extrapolate it to 2050.
      LEGACY.METAL_MARKET_PRESERVED_YEAR_OUTSIDE_SUPPORT: 103
      # Two germanium-concentrate provider lookups retain source inputs.
      LEGACY.METAL_MATERIAL_PROVIDER_UNAVAILABLE: 2
      # Seven unresolved upstream boundaries and 19 content/co-mining gaps.
      # All 75 reviewed cases remain in scope coverage and provenance; no
      # extraction or other inventory amount was changed to clear warnings.
      LEGACY.METAL_RESOURCE_CORRECTION_PRESERVED: 26
      # Residual NMVOC and absent THC totals cannot establish parent aggregates.
      LEGACY.TRANSPORT_EMISSION_SCOPE_UNAVAILABLE: 27
      # Final post-GAINS car checks: 36 earlier diagnostics clear and 38 new
      # cases appear. Combined versus hot-only remains a heuristic screen;
      # cold-start/evaporation/deterioration remain unresolved.
      LEGACY.TRANSPORT_HOT_EMISSION_DIAGNOSTIC: 83
      # Reviewed native gas supply now resolves all 93 CNG cases. Do not permit
      # their reintroduction; unknown supply still emits this diagnostic.
      LEGACY.VEHICLE_FUEL_CARBON_UNAVAILABLE: 0
