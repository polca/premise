name: Github Action
on:
  push:
    paths:
      - "**.py"
      - "premise/data/**"
      - "premise/iam_variables_mapping/**"
      - "conda/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/main.yml"
  pull_request:
    paths:
      - "**.py"
      - "premise/data/**"
      - "premise/iam_variables_mapping/**"
      - "conda/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/main.yml"

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Black formatting
        uses: lgeiger/black-action@v1.0.1
        with:
          args: "./"


      - name: Check for modified files
        id: git-check
        run: echo ::set-output name=modified::$(if git diff-index --quiet HEAD --; then echo "false"; else echo "true"; fi)

      - name: Push changes
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config --global user.email "r_s@me.com"
          git config --global user.name "romainsacchi"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY
          git checkout $GITHUB_HEAD_REF
          git commit -am "Black reformating"
          git push

  build:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    needs: clean

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[bw25]" pytest pytest-instafail
          python -m pip check

      - name: Verify numerical runtime imports
        run: |
          python -c "import numpy as np; import pyarrow as pa; from premise import NewDatabase; assert pa.array(np.array([1.0])).to_pylist() == [1.0]; print(f'NumPy {np.__version__}, PyArrow {pa.__version__}')"

      - name: Verify Brightpath export support
        run: |
          python -c "from premise.simapro_export import check_brightpath; check_brightpath(); from brightpath.formats.openlca_methods import OpenLCAMethodMapping"

      - name: Run tests
        run: |
          pytest -m "not slow" --instafail
        env:
          GITHUB_TOKEN: ${{ secrets.COVERALLS }}
          IAM_FILES_KEY: ${{ secrets.IAM_FILES_KEY }}
          EI_USERNAME: ${{ secrets.EI_USERNAME }}
          EI_PASSWORD: ${{ secrets.EI_PASSWORD }}

      # Fork pull requests cannot access the licensed database credentials.
      # Pushes and same-repository pull requests must pass fresh full builds on
      # the minimum and newest supported Python versions before publication.
      # Without
      # private LCIA references this gate checks a finite LCIA smoke result;
      # reference comparisons run only when a private reference file is supplied.
      - name: Build ecoinvent 3.12 cutoff and validate Brightway results
        if: >-
          (matrix.python-version == '3.12' || matrix.python-version == '3.15') &&
          (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          IAM_FILES_KEY: ${{ secrets.IAM_FILES_KEY }}
          EI_USERNAME: ${{ secrets.EI_USERNAME }}
          EI_PASSWORD: ${{ secrets.EI_PASSWORD }}
          PYTHONHASHSEED: "0"
        run: |
          python - <<'PY'
          import os

          required = ("IAM_FILES_KEY", "EI_USERNAME", "EI_PASSWORD")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Full build requires CI secrets: " + ", ".join(missing))
          PY
          pytest -q --instafail tests/test_process_ei312_cutoff.py::test_brightway

  legacy-tests:
    runs-on: ubuntu-latest
    needs: clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the supported legacy Brightway stack
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[bw2]" pytest pytest-instafail
          python -m pip check
      - name: Test legacy Brightway support
        env:
          IAM_FILES_KEY: ${{ secrets.IAM_FILES_KEY }}
        run: pytest -q -m "not slow" --instafail

  Pypi:
    runs-on: ubuntu-latest
    needs: [build, legacy-tests]

    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest" ]
        python-version: [ "3.12" ]

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pypa/build
        run: >-
          python -m
          pip install
          build
          twine

      - name: Build a binary wheel and a source tarball
        run: >-
          python -m
          build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Publish distribution 📦 to PyPI if Release
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true

  conda:
    name: (${{ matrix.python-version }}, ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [build, legacy-tests]
    outputs:
      package_version: ${{ steps.package_version.outputs.version }}

    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest" ]
        python-version: [ "3.12" ]
    steps:
      - uses: actions/checkout@v2
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,cmutel,konstantinstadler,haasad,pascallesage,romainsacchi
          allow-softlinks: true
          channel-priority: strict
          auto-update-conda: true
          activate-environment: test

      - name: Set Conda package version
        id: package_version
        shell: bash
        run: echo "version=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: Conda info
        shell: bash -l {0}
        run: conda info

      - name: Publish all variants 📦 to Anaconda if Push and if master branch
        if: startsWith(github.ref, 'refs/heads/master')
        shell: bash -l {0}

        run: |
          PKG_NAME=premise
          USER=romainsacchi
          conda install -y anaconda-client conda-build
          mkdir ~/conda-bld
          conda config --set anaconda_upload no
          export CONDA_BLD_PATH=~/conda-bld
          export VERSION="${{ steps.package_version.outputs.version }}"

          # Build the package with all variants
          conda-build conda/ --old-build-string

          # List built .tar.bz2 and .conda packages
          BUILT_PACKAGES=$(find $CONDA_BLD_PATH -type f \( -name "*.tar.bz2" -o -name "*.conda" \))

          echo "Built packages:"
          echo $BUILT_PACKAGES

          # Upload each valid package
          for PACKAGE in $BUILT_PACKAGES; do
            echo "Uploading $PACKAGE"
            anaconda -t ${{ secrets.ANACONDA_CLOUD }} upload -u $USER $PACKAGE --force
          done
  
  

  testconda:
    name: (${{ matrix.package }}, py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: conda

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        package: ["premise-bw2", "premise-bw25"]
        solver: ["libmamba"]
        exclude:
          - {package: premise-bw2, python-version: "3.13"}
          - {package: premise-bw2, python-version: "3.14"}
          - {package: premise-bw2, python-version: "3.15"}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,cmutel,konstantinstadler,haasad,pascallesage,romainsacchi
          allow-softlinks: true
          auto-update-conda: true
          channel-priority: strict
          conda-remove-defaults: true
          activate-environment: test
          conda-solver: ${{ matrix.solver }}

      - name: Pull distribution 📦 from Anaconda and test it if master branch
        if: startsWith(github.ref, 'refs/heads/master')
        shell: bash
        run: |
          package_spec="romainsacchi::${{ matrix.package }}=${{ needs.conda.outputs.package_version }}"

          for attempt in 1 2 3 4 5; do
            if conda install --name test --yes --solver libmamba \
              "python=${{ matrix.python-version }}" \
              "$package_spec"; then
              if conda run --name test \
                python -c "import premise; print(premise.__version__)"; then
                exit 0
              fi

              echo "Installed $package_spec, but importing premise failed."
              exit 1
            fi

            if [[ "$attempt" == "5" ]]; then
              echo "Failed to install $package_spec after $attempt attempts."
              exit 1
            fi

            echo "Install attempt $attempt failed; refreshing the channel index before retrying."
            conda clean --index-cache --yes
            sleep 30
          done
        env:
          IAM_FILES_KEY: ${{ secrets.IAM_FILES_KEY }}
