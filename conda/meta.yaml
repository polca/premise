{% set name = "premise" %}
{% set version = environ.get('VERSION', "0.0.0") %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ..

outputs:
  - name: premise-bw2
    build:
      noarch: python
      script: "python -m pip install . --no-deps --no-build-isolation -vv"
    requirements:
      host:
        - pip
        - python >=3.10
        - setuptools
        - wheel
      run:
        - bw2data <4.0.0
        - python >=3.10
        - bottleneck
        - bw2io
        - ecoinvent_interface
        - constructive_geometries>=1.0.0
        - cryptography
        - datapackage
        - numpy <2.0.0
        - openpyxl >=3.1.0,<3.2.0
        - lxml <6.0.0
        - pandas <3.0.0
        - platformdirs
        - portalocker >=2.8
        - premise_gwp
        - prettytable
        - pyarrow
        - pycountry
        - pyYaml
        - requests
        - schema
        - scipy<1.14.0
        - sparse>=0.14.0
        - wurst>=0.4
        - xarray<=2024.2.0
        - tqdm
        - unfold
    test:
      requires:
        - python >=3.10
      imports:
        - premise
      commands:
        - python -c "import premise; print(premise.__version__)"

  - name: premise-bw25
    build:
      noarch: python
      script: "python -m pip install . --no-deps --no-build-isolation -vv"
    requirements:
      host:
        - pip
        - python >=3.10
        - setuptools
        - wheel
      run:
        - bw2data >=4.0.0
        - bw_processing >=1.0
        - python >=3.10
        - bottleneck
        - bw2io
        - ecoinvent_interface
        - constructive_geometries>=1.0.0
        - cryptography
        - datapackage
        - numpy <2.0.0
        - openpyxl >=3.1.0,<3.2.0
        - lxml <6.0.0
        - pandas <3.0.0
        - platformdirs
        - portalocker >=2.8
        - premise_gwp
        - prettytable
        - pyarrow
        - pycountry
        - pyYaml
        - requests
        - schema
        - scipy<1.14.0
        - sparse>=0.14.0
        - wurst>=0.4
        - xarray<=2024.2.0
        - tqdm
        - unfold
    test:
      requires:
        - python >=3.10
      imports:
        - premise
      commands:
        - python -c "import premise; print(premise.__version__)"

channels:
  - conda-forge
  - defaults


about:
  home: https://github.com/polca/premise
  license: BSD License
  summary: 'Coupling Integrated Assessment Models and Life Cycle Assessment.'
license_family: BSD
license_file: LICENSE
