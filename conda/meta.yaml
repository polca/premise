{% set name = "premise" %}
{% set version = environ.get('VERSION', "0.0.0") %}


package:
  name: {{ name }}
  version: {{ version }}

# Build Brightpath from the same GitHub revision used by requirements.txt.
source:
  - path: ..
    folder: premise-src
  - url: https://codeload.github.com/romainsacchi/brightpath/tar.gz/b48e816ddfe982d08a58db153a724b887db7ca26
    sha256: a3d3af03a3dc5e3d0efd9fa8734f51eb57f7b884fe5d9a5f108438cc3981308d
    folder: brightpath-src

outputs:
  - name: brightpath
    version: 1.0.0a3
    build:
      noarch: python
      number: 0
      string: github_b48e816d_0
      script: python -m pip install "$SRC_DIR/brightpath-src" --no-deps --no-build-isolation -vv
    requirements:
      host:
        - python >=3.12
        - pip
        - setuptools >=77
        - wheel
      run:
        - python >=3.12
        - bw2io
        - olca-schema >=2.6.2,<3
        - pyyaml >=6
        - xlsxwriter >=3
    test:
      imports:
        - brightpath
        - brightpath.formats.openlca_methods
        - brightpath.formats.simapro_csv
        - brightpath.profiles.simapro_waste
        - brightpath.profiles.simapro_category_types
        - brightpath.profiles.simapro_biosphere
    about:
      home: https://github.com/romainsacchi/brightpath
      license: BSD-3-Clause
      license_file: brightpath-src/LICENSE
      summary: Validate, migrate, and exchange life-cycle inventories across LCA formats.

  - name: premise-bw2
    build:
      noarch: python
      script: python -m pip install "$SRC_DIR/premise-src" --no-deps --no-build-isolation -vv
    requirements:
      host:
        - pip
        - python >=3.12
        - setuptools
        - wheel
      run:
        - bw2data <4.0.0
        - python >=3.12
        - bottleneck
        - {{ pin_subpackage("brightpath", exact=True) }}
        - bw2io
        - ecoinvent_interface
        - constructive_geometries>=1.0.0
        - cryptography
        - datapackage
        - numpy <2.0.0
        - openpyxl >=3.1.0,<3.2.0
        - lxml <6.0.0
        - pandas <3.0.0
        - platformdirs
        - portalocker >=2.8
        - premise_gwp
        - prettytable
        - pyarrow
        - pycountry
        - pyYaml
        - requests
        - schema
        - scipy<1.14.0
        - sparse>=0.14.0
        - wurst>=0.4
        - xarray<=2024.2.0
        - tqdm
        - unfold
    test:
      requires:
        - python >=3.12
      imports:
        - premise
        - brightpath
      commands:
        - python -c "import premise; print(premise.__version__)"
        - python -c "from premise.simapro_export import check_brightpath; check_brightpath(); from brightpath.formats.openlca_methods import OpenLCAMethodMapping"

  - name: premise-bw25
    build:
      noarch: python
      script: python -m pip install "$SRC_DIR/premise-src" --no-deps --no-build-isolation -vv
    requirements:
      host:
        - pip
        - python >=3.12
        - setuptools
        - wheel
      run:
        - bw2data >=4.0.0
        - bw_processing >=1.0
        - python >=3.12
        - bottleneck
        - {{ pin_subpackage("brightpath", exact=True) }}
        - bw2io
        - ecoinvent_interface
        - constructive_geometries>=1.0.0
        - cryptography
        - datapackage
        - numpy <2.0.0
        - openpyxl >=3.1.0,<3.2.0
        - lxml <6.0.0
        - pandas <3.0.0
        - platformdirs
        - portalocker >=2.8
        - premise_gwp
        - prettytable
        - pyarrow
        - pycountry
        - pyYaml
        - requests
        - schema
        - scipy<1.14.0
        - sparse>=0.14.0
        - wurst>=0.4
        - xarray<=2024.2.0
        - tqdm
        - unfold
    test:
      requires:
        - python >=3.12
      imports:
        - premise
        - brightpath
      commands:
        - python -c "import premise; print(premise.__version__)"
        - python -c "from premise.simapro_export import check_brightpath; check_brightpath(); from brightpath.formats.openlca_methods import OpenLCAMethodMapping"

channels:
  - conda-forge
  - defaults


about:
  home: https://github.com/polca/premise
  license: BSD License
  summary: 'Coupling Integrated Assessment Models and Life Cycle Assessment.'
license_family: BSD
license_file: premise-src/LICENSE
