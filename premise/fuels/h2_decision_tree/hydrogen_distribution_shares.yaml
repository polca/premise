# Indicative hydrogen distribution-mode shares.
#
# Rules are evaluated uniformly:
# 1. Keep rules whose match fields equal the demand-node row values.
# 2. Keep rules whose condition is satisfied by the selected basis column.
# 3. Select the matching rule with the lowest priority value.
#
# match: {} applies to every demand node.
# condition: {} always applies when the match succeeds.
# Demand limits are evaluated as min_demand <= demand < max_demand.
# Transport shares should sum to 1.0 unless a rule explicitly documents an
# onsite-production remainder. Values are placeholders until sector-specific
# threshold assumptions are finalized.

rules:
  - name: heating_always_pipeline
    priority: 10
    match:
      sector: Residential and commercial buildings
    basis: hydrogen_demand_t_per_node_per_year
    condition: {}
    shares:
      compressed_gaseous_truck: 0.00
      liquid_hydrogen_truck: 0.00
      compressed_gaseous_pipeline: 1.00
      liquid_ammonia_ship: 0.00
      liquid_hydrogen_ship: 0.00

  - name: large_steel_ammonia_transport
    priority: 20
    match:
      demand_node_type: steel_plants
    basis: hydrogen_demand_t_per_node_per_year
    condition:
      min_demand: 50000
    shares:
      compressed_gaseous_truck: 0.00
      liquid_hydrogen_truck: 0.00
      compressed_gaseous_pipeline: 0.70
      liquid_ammonia_ship: 0.30
      liquid_hydrogen_ship: 0.00


  - name: default_small_demand
    priority: 100
    match: {}
    basis: hydrogen_demand_t_per_node_per_year
    condition:
      min_demand: 0
      max_demand: 1000
    shares:
      compressed_gaseous_truck: 0.80
      liquid_hydrogen_truck: 0.20
      compressed_gaseous_pipeline: 0.00
      liquid_ammonia_ship: 0.00
      liquid_hydrogen_ship: 0.00

  - name: default_medium_demand
    priority: 100
    match: {}
    basis: hydrogen_demand_t_per_node_per_year
    condition:
      min_demand: 1000
      max_demand: 5000
    shares:
      compressed_gaseous_truck: 0.25
      liquid_hydrogen_truck: 0.25
      compressed_gaseous_pipeline: 0.50
      liquid_ammonia_ship: 0.00
      liquid_hydrogen_ship: 0.00

  - name: default_large_demand
    priority: 100
    match: {}
    basis: hydrogen_demand_t_per_node_per_year
    condition:
      min_demand: 5000
      max_demand: 50000
    shares:
      compressed_gaseous_truck: 0.00
      liquid_hydrogen_truck: 0.20
      compressed_gaseous_pipeline: 0.80
      liquid_ammonia_ship: 0.00
      liquid_hydrogen_ship: 0.00

  - name: default_very_large_demand
    priority: 100
    match: {}
    basis: hydrogen_demand_t_per_node_per_year
    condition:
      min_demand: 50000
    # On-site production adds no transport activity to the sector market.
    on_site_production_share: 0.20
    shares:
      compressed_gaseous_truck: 0.00
      liquid_hydrogen_truck: 0.00
      compressed_gaseous_pipeline: 0.80
      liquid_ammonia_ship: 0.00
      liquid_hydrogen_ship: 0.00
