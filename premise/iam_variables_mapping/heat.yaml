    remind-eu: FE|Buildings|Liquids|Fossil|+|Coal
    message: Final Energy|Residential and Commercial|Liquids|Coal
  assumption: Coal-derived liquids use the existing coal methanol boiler proxy.

heat, buildings, from coal stove:
