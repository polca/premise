# Heat mappings are deliberately split into three layers. IAM aliases can be a
# string, a list of strings (summed), or an explicit linear expression. Values
# are kept as raw energy volumes until inventory-derived conversion factors have
# converted final energy to delivered heat.

# ---------------------------------------------------------------------------
# Buildings: delivered end-use heat
# ---------------------------------------------------------------------------

heat, buildings, from district heating:
  layer: buildings_end_use
  energy_basis: heat_output
  conversion: none
  ecoinvent_aliases:
    fltr: heat, district or industrial, other than natural gas
    mask: [group, generic]
  iam_aliases:
    remind: FE|Buildings|Heating|District Heating
    remind-eu: FE|Buildings|Heating|District Heating
    gcam: Final Energy|Heat|Buildings|District Heat
    image:
      - Final Energy|Residential|Space Heating|Heat
      - Final Energy|Residential|Water Heating|Heat
      - Final Energy|Commercial|Space Heating|Heat
      - Final Energy|Commercial|Water Heating|Heat
    message: Final Energy|Residential and Commercial|Heat
  supplier_type: secondary_market

