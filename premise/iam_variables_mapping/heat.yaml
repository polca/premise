# Heat mappings are deliberately split into three layers. IAM aliases can be a
# string, a list of strings (summed), or an explicit linear expression. Values
# are kept as raw energy volumes until inventory-derived conversion factors have
# converted final energy to delivered heat.

# ---------------------------------------------------------------------------
# Buildings: delivered end-use heat
# ---------------------------------------------------------------------------

heat, buildings, from district heating:
  layer: buildings_end_use
  energy_basis: heat_output
  conversion: none
  ecoinvent_aliases:
    fltr: heat, district or industrial, other than natural gas
    mask: [group, generic]
  iam_aliases:
    remind: FE|Buildings|Heating|District Heating
    remind-eu: FE|Buildings|Heating|District Heating
    gcam: Final Energy|Heat|Buildings|District Heat
    image:
      - Final Energy|Residential|Space Heating|Heat
      - Final Energy|Residential|Water Heating|Heat
      - Final Energy|Commercial|Space Heating|Heat
      - Final Energy|Commercial|Water Heating|Heat
    message: Final Energy|Residential and Commercial|Heat
  supplier_type: secondary_market

heat, buildings, from hydrogen boiler:
  layer: buildings_end_use
  energy_basis: final_energy
  conversion: combustion
  ecoinvent_aliases:
    fltr: heat, residential, by combustion of hydrogen using boiler
  iam_aliases:
    remind: FE|Buildings|Heating|Hydrogen
    remind-eu: FE|Buildings|Heating|Hydrogen
    gcam: Final Energy|Heat|Buildings|Hydrogen
    image:
      - Final Energy|Residential|Space Heating|Hydrogen
      - Final Energy|Residential|Water Heating|Hydrogen
      - Final Energy|Commercial|Space Heating|Hydrogen
      - Final Energy|Commercial|Water Heating|Hydrogen
    message: Final Energy|Residential and Commercial|Hydrogen|Combustion

heat, buildings, from hydrogen fuel cell:
  layer: buildings_end_use
  energy_basis: final_energy
  conversion: combustion
  ecoinvent_aliases:
    fltr: heat, residential, by conversion of hydrogen using fuel cell
  iam_aliases:
    message: Final Energy|Residential and Commercial|Hydrogen|Fuel Cell

heat, buildings, from natural gas boiler:
  layer: buildings_end_use
  energy_basis: final_energy
  conversion: combustion
  ecoinvent_aliases:
    fltr: heat production, natural gas, at boiler condensing modulating <100kW
  iam_aliases:
    remind: FE|Buildings|Heating|Gases
    remind-eu: FE|Buildings|Heating|Gases
    gcam: Final Energy|Heat|Buildings|Gas
    image:
      - Final Energy|Residential|Space Heating|Natural Gas
      - Final Energy|Residential|Water Heating|Natural Gas
      - Final Energy|Commercial|Space Heating|Gases|Fossil
      - Final Energy|Commercial|Water Heating|Gases|Fossil
    message: Final Energy|Residential and Commercial|Gases|Gas

heat, buildings, from biomethane boiler:
  layer: buildings_end_use
  energy_basis: final_energy
  conversion: combustion
  ecoinvent_aliases:
    fltr: heat, residential, by combustion of biomethane using boiler
  iam_aliases:
    message: Final Energy|Residential and Commercial|Gases|Biomass

heat, buildings, from LPG boiler:
  layer: buildings_end_use
  energy_basis: final_energy
  conversion: combustion
  ecoinvent_aliases:
    fltr: heat, residential, by combustion of liquefied petroleum gas using boiler
  iam_aliases:
    remind: FE|Buildings|Liquids|Fossil|+|Gas
    remind-eu: FE|Buildings|Liquids|Fossil|+|Gas
    message: Final Energy|Residential and Commercial|Liquids|Gas
  assumption: Ambiguous gas-derived liquids retain the existing LPG boiler proxy.

heat, buildings, from biomass-based methanol boiler:
  layer: buildings_end_use
  energy_basis: final_energy
  conversion: combustion
  ecoinvent_aliases:
    fltr: heat, residential, by combustion of methanol using boiler, distributed by truck, produced with biomass
