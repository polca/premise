    remind: FE|Buildings|Liquids|+|Biomass
    remind-eu: FE|Buildings|Liquids|+|Biomass
    message: Final Energy|Residential and Commercial|Liquids|Biomass
  assumption: Biomass-derived liquids use the existing biomass methanol boiler proxy.

heat, buildings, from coal-based methanol boiler:
  layer: buildings_end_use
  energy_basis: final_energy
