  iam_aliases:
    remind: FE|Buildings|Solids|Biomass|+|Traditional
    remind-eu: FE|Buildings|Solids|Biomass|+|Traditional
    gcam: Final Energy|Heat|Buildings|Biomass
    image:
      - Final Energy|Residential|Space Heating|Traditional Biomass
      - Final Energy|Residential|Water Heating|Traditional Biomass
      - Final Energy|Commercial|Space Heating|Solids|Biomass|Traditional
      - Final Energy|Commercial|Water Heating|Solids|Biomass|Traditional
    message: Final Energy|Residential and Commercial|Solids|Biomass|Traditional

heat, buildings, from wood pellets heater:
  layer: buildings_end_use
  energy_basis: final_energy
  conversion: combustion
  ecoinvent_aliases:
    fltr: heat production, wood pellet, at furnace 9kW
    mask: state-of-the-art 2014
  iam_aliases:
    remind: FE|Buildings|Solids|Biomass|+|Modern
    remind-eu: FE|Buildings|Solids|Biomass|+|Modern
    image:
      - Final Energy|Residential|Space Heating|Modern Biomass
      - Final Energy|Residential|Water Heating|Modern Biomass
      - Final Energy|Commercial|Space Heating|Solids|Biomass|Modern
      - Final Energy|Commercial|Water Heating|Solids|Biomass|Modern
    message: Final Energy|Residential and Commercial|Solids|Biomass|Modern

heat, buildings, from heat pump:
  layer: buildings_end_use
  energy_basis: final_energy
  conversion: heat_pump
  ecoinvent_aliases:
    fltr: heat production, air-water heat pump 10kW
  iam_aliases:
    remind: FE|Buildings|Heating|Electricity|Heat pump
    remind-eu: FE|Buildings|Heating|Electricity|Heat pump
    message: Final Energy|Residential and Commercial|Electricity|Thermal|Heat Pumps

heat, buildings, from electric heater:
  layer: buildings_end_use
  energy_basis: final_energy
  conversion: electric_boiler
  ecoinvent_aliases:
    fltr: heat, residential, electric storage heater, using electricity from grid
  iam_aliases:
    remind: FE|Buildings|Heating|Electricity|Resistance
    remind-eu: FE|Buildings|Heating|Electricity|Resistance
    gcam: Final Energy|Heat|Buildings|Electricity
    image:
      - Final Energy|Residential|Space Heating|Electricity
      - Final Energy|Residential|Water Heating|Electricity
      - Final Energy|Commercial|Space Heating|Electricity
      - Final Energy|Commercial|Water Heating|Electricity
    message: Final Energy|Residential and Commercial|Electricity|Thermal|Resistance
  assumption: IMAGE and GCAM unsplit building electricity retain resistance heating.

heat, buildings, from light fuel oil boiler:
  layer: buildings_end_use
  energy_basis: final_energy
  conversion: combustion
  ecoinvent_aliases:
    fltr: heat production, light fuel oil, at boiler 100kW condensing, non-modulating
  iam_aliases:
    remind: FE|Buildings|Liquids|Fossil|+|Oil
    remind-eu: FE|Buildings|Liquids|Fossil|+|Oil
    image:
      - Final Energy|Residential|Space Heating|Liquid (fossil)
      - Final Energy|Residential|Water Heating|Liquid (fossil)
      - Final Energy|Commercial|Space Heating|Liquids|Fossil
      - Final Energy|Commercial|Water Heating|Liquids|Fossil
    gcam: Final Energy|Heat|Buildings|Oil
    message: Final Energy|Residential and Commercial|Liquids|Oil

heat, buildings, residual:
  layer: buildings_end_use
  energy_basis: heat_output
  conversion: none
  residual: true
  supplier_type: frozen_legacy
  ecoinvent_aliases:
    fltr: market for heat, central or small-scale, other than natural gas
  iam_aliases:
    message: Final Energy|Residential and Commercial|Other
  assumption: MESSAGE Other is represented by a frozen legacy building-heat mix.

