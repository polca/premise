heat, buildings, from hydrogen fuel cell:
  uvek_aliases:
    delivered_heat_factor: 0.33
    delivered_heat_basis: "premise/data/heat/uvek2026_review.json: heat, buildings, from hydrogen fuel cell; independently documented LHV heat efficiency, not allocated fuel draw"
    use_legacy_templates: false
    exact: true
    fltr:
      name:
      - Heat, residential, by conversion of hydrogen using fuel cell, SOFC, allocated by exergy, distributed by pipeline, produced by Electrolysis,
        PEM using electricity from grid
      reference product:
      - Heat, residential, by conversion of hydrogen using fuel cell, SOFC, allocated by exergy, distributed by pipeline, produced by Electrolysis,
        PEM using electricity from grid
      unit: megajoule
    native_reference_amount: 1
    native_limitations:
    - Complete native exergy-allocated SOFC heat inventory retained at its original Swiss location, including both signed hydrogen inputs, infrastructure,
      maintenance, water and supported uncertainty. No deallocation, electricity co-product credit, inventory rescaling or added upstream hydrogen
      burden.
    - IAM final hydrogen energy converts to delivered heat using the independently documented nominal 33% LHV heat efficiency. Allocated fuel inputs
      must not be inverted to infer physical efficiency. The source documents 8% exergy allocation and 0.56% use loss; retain those quantities without
      an additional loss correction. Nominal documentation and rounded/allocated inventory draws are not an exact physical energy balance.
    - The IAM source proxy is PEM; native SOFC technology, residential scale for industrial use, Swiss electricity/pipeline hydrogen, vintage, allocation
      and regional extrapolation are explicit screening limitations with unquantified score effects. Future hydrogen decarbonization is not implied
      by this heat-only mapping.
  layer: buildings_end_use
  energy_basis: final_energy
  conversion: combustion
  ecoinvent_aliases:
    fltr: heat, residential, by conversion of hydrogen using fuel cell
  iam_aliases:
    message: Final Energy|Residential and Commercial|Hydrogen|Fuel Cell

