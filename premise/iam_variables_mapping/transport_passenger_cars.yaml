# mapping between premise and IAM terminology regarding passenger cars
# transport volumes (ES; units depend on IAM), energy use (FE), and optional
# vehicle energy intensity (MJ/vehicle-km; distinct from fleet volumes)
---
'passenger car, battery electric, large':
  uvek_aliases:
    use_legacy_templates: false
    fltr:
      name: Transport, passenger car, battery electric, NMC-622 battery, Large, 2021
      reference product: Transport, passenger car, battery electric, NMC-622 battery, Large, 2021
      unit: kilometer
    exact: true
    native_reference_amount: 1
    native_limitations:
    - Use the complete native passenger-car service per positive vehicle-kilometre through the shared regionalization,
      IAM efficiency, energy floor, fuel-carbon and fleet-market methods. Retain vehicle production, maintenance,
      wear, road, disposal and all ancillary burdens once; no occupancy, payload, lifetime or production multiplier
      is added.
    - These 2021-labelled native services are historical prototypes; some electric/fuel-cell documentation states
      a 2020 technology basis. Preserve their source design and the shared relative IAM calculation, warning about
      class, geography, driving cycle, fleet, vintage, allocation, internal uncertainty and native biosphere exclusions.
      Score effects are unquantified.
    - Legacy complete native vehicles have no declared capacity-market sizing contract. Retain their installed kg-based
      pack and vehicle-mass model under the existing shared legacy-inventory policy; do not fabricate a kWh-capacity
      purchase or constant-range contract from rounded specifications. The separate marked CLIC vehicles retain their
      own existing sizing policy.
    - Use the complete native Large class as the representative of this IAM role, without a mass or class-conversion
      factor. NMC-622 with ordinary grid charging represents generic BEV; certified-electricity, LFP and NCA variants
      remain outside this role.
  uvek_fuel_aliases:
    fltr:
      name:
      - Electricity, low voltage, at grid
      - market group for electricity, low voltage
      - market for electricity, low voltage
      unit: kilowatt hour
    exact: true
    exact_identities:
    - name: Electricity, low voltage, at grid
      unit: kilowatt hour
    - name: market group for electricity, low voltage
      unit: kilowatt hour
    - name: market for electricity, low voltage
      unit: kilowatt hour
  iam_aliases:
    remind: ES|Transport|Pass|Road|LDV|Four Wheelers|Large|Large Car|BEV
    remind-eu: ES|Transport|Pass|Road|LDV|Four Wheelers|Large|Large Car|BEV
    gcam: Distance|Transport|Pass|Road|LDV|Large Car and Truck|BEV
  energy_intensity_aliases:
    remind: Energy intensity|Transport|Pass|Road|LDV|Four Wheelers|Large|Large Car|BEV
    remind-eu: Energy intensity|Transport|Pass|Road|LDV|Four Wheelers|Large|Large Car|BEV
  # Efficiency-only proxy where both native regional calculation paths are unavailable.
  energy_intensity_fallback_aliases:
    remind: Energy intensity|Transport|Pass|Road|LDV|Four Wheelers|Large|Large Car and SUV|BEV
    remind-eu: Energy intensity|Transport|Pass|Road|LDV|Four Wheelers|Large|Large Car and SUV|BEV
  energy_use_aliases:
    remind: FE|Transport|Pass|Road|LDV|Four Wheelers|Large|Large Car|BEV
    remind-eu: FE|Transport|Pass|Road|LDV|Four Wheelers|Large|Large Car|BEV
    gcam: Final Energy|Transport|Pass|Road|LDV|Large Car and Truck|BEV
  ecoinvent_aliases:
    fltr:
      - 'transport, passenger car, battery electric, Large'
    mask:
      - SUV
  ecoinvent_fuel_aliases:
    fltr:
      - electricity
