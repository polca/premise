  limitations:
  - The native Swiss clinker inventory is a rotary-kiln industry average with a positive one-kg clinker
    reference. Use it as the baseline clinker template for the existing shared IAM route transformations;
    its documentation does not distinguish dry/wet kiln subclasses. This technology, geography and vintage
    screening proxy has unquantified score effects. Retain its complete inventory, native product basis
    and the ordinary Premise efficiency, CCS and regional market algorithms; do not infer a new kiln inventory
    or alter source reference quantities.
  - Fourteen inspected native cement factories consume this clinker per kg of their own cement grade.
    Keep each grade, clinker dose and all non-clinker inputs. Replace only the clinker supplier with the
    ordinary regional clinker market, preserving signed quantity, formula and uncertainty. The source
    has no separate cement market tier; do not invent one. Existing positive/negative slag allocations
    and grade distinctions remain.
