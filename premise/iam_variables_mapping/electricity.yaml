# UVEK 2026 cut-off identities checked against the installed biosphere310 database
# and Brightpath catalog. Exact filters select native production, not grid mixes.
# Empty aliases deliberately require reviewed CLIC slug + role bindings. No
# ecoinvent names or unreviewed cycle, allocation, size, or enrichment proxies.
# Combustion suppliers in MJ are explicit: UVEK separates fuel burning from
# electricity production. Shared IAM aliases and efficiency bounds stay below.
Biogas CHP:
  uvek_aliases: {}
  uvek_fuel_aliases:
    exact: true
    fltr:
      name:
      - Biogas, production mix, at storage
      reference product:
      - Biogas, production mix, at storage
      unit: cubic meter
  ecoinvent_aliases:
    fltr:
      - heat and power co-generation, biogas, gas engine
    mask:
      reference product: heat
  ecoinvent_fuel_aliases:
    fltr:
    - market for biogas
  eff_aliases:
    tiam-ucl: Efficiency|Electricity|Biogas|w/o CCS
  iam_aliases:
    tiam-ucl: Secondary Energy|Electricity|Biogas|w/o CCS
  max_efficiency: 0.6
Biomass CHP:
  uvek_aliases:
    exact: true
    fltr:
      name: Electricity, at cogen ORC 1400kWth, wood, allocation exergy
      reference product: Electricity, at cogen ORC 1400kWth, wood, allocation exergy
      unit: kilowatt hour
    native_reference_amount: 1
    native_limitations:
    - "Approved UVEK electricity-pilot Biomass CHP screening proxy: the complete Swiss wood-fired ORC 1400 kWth cogenerator, allocated by exergy, represents the IAM biomass CHP role per 1 kWh. Scale, cycle, allocation, geography and vintage may differ from the regional IAM fleet. No separate heat credit is added. Regional supplier selection and eligible IAM efficiency updates follow the standard Premise workflow; allocation, physical-performance and regional representativeness remain screening limitations."
  uvek_fuel_aliases:
    exact: true
    fltr:
      name:
      - Wood chips, production mix, wet, measured as dry mass, at forest road & at sawmill
      - market for lignocellulosic biomass, used as fuel
      reference product:
      - Wood chips, production mix, wet, measured as dry mass, at forest road & at sawmill
      - lignocellulosic biomass
      unit: kilogram
  ecoinvent_aliases:
    fltr:
    - heat and power co-generation, wood chips
    mask:
      reference product:
      - heat
      - label
      - renewable
  ecoinvent_fuel_aliases:
    fltr:
    - market for wood chips, wet, measured as dry mass
    - market for wood chips, green, measured as dry mass
    - market for biomass, used as fuel
    - market for lignocellulosic biomass, used as fuel
  eff_aliases:
    image: Efficiency|Electricity|Biomass|w/o CCS|3
    remind: Tech|Electricity|Biomass|Combined Heat and Power w/o CC|Efficiency
    remind-eu: Tech|Electricity|Biomass|Combined Heat and Power w/o CC|Efficiency
    tiam-ucl: Efficiency|Electricity|Biomass CHP|w/o CCS
    witch: Efficiency|Electricity|Biomass|w/o CCS
  iam_aliases:
    image: Secondary Energy|Electricity|Biomass|w/o CCS|3
    remind: SE|Electricity|Biomass|++|Combined Heat and Power w/o CC
    remind-eu: SE|Electricity|Biomass|++|Combined Heat and Power w/o CC
    tiam-ucl: Secondary Energy|Electricity|Biomass CHP|w/o CCS
    witch: Secondary Energy|Electricity|Biomass|w/o CCS
  max_efficiency: 0.3
