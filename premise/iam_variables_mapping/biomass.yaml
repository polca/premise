# mapping between premise and the terminology
# used in the IAMs regarding the origin of biomass
# used in the production of electricity
---
biomass crops - purpose grown:
  uvek_aliases:
    use_legacy_templates: false
    exact: true
    fltr:
      name:
      - Wood chips, beech, wet, sustainable forest management, measured as dry mass, at forest road
      - Wood chips, birch, wet, sustainable forest management, measured as dry mass, at forest road
      - Wood chips, hardwood, wet, sustainable forest management, measured as dry mass, at forest road
      - Wood chips, oak, wet, sustainable forest management, measured as dry mass, at forest road
      - Wood chips, pine, wet, sustainable forest management, measured as dry mass, at forest road
      - Wood chips, softwood, wet, sustainable forest management, measured as dry mass, at forest road
      - Wood chips, spruce, wet, sustainable forest management, measured as dry mass, at forest road
      reference product:
      - Wood chips, beech, wet, sustainable forest management, measured as dry mass, at forest road
      - Wood chips, birch, wet, sustainable forest management, measured as dry mass, at forest road
      - Wood chips, hardwood, wet, sustainable forest management, measured as dry mass, at forest road
      - Wood chips, oak, wet, sustainable forest management, measured as dry mass, at forest road
      - Wood chips, pine, wet, sustainable forest management, measured as dry mass, at forest road
      - Wood chips, softwood, wet, sustainable forest management, measured as dry mass, at forest road
      - Wood chips, spruce, wet, sustainable forest management, measured as dry mass, at forest road
      unit: kilogram
    native_supply_class: forest
    native_reference_amount: 1
    native_limitations:
    - Native forest-road chips proxy purpose-grown woody/energy-crop supply; land use, cultivation, species, harvest and allocation differ. Clean sawmill chips proxy forest residues; collection/chipping, origin, coproduct allocation and delivery differ. Complete native inventories and their existing carbon accounting are retained; no invented biogenic uptake, recovery credit or drying burden.
    - All selected supplies reference one kilogram of dry wood; preserve fuel dry mass without converting the separate gross-energy residue process to kg. IAM technology fractions use a common woody-fuel basis; no density, moisture or calorific multiplier is inferred. Geographic portfolios and vintage remain screening proxies with unquantified score effects.
  iam_aliases:
    image:
      - Primary Energy|Biomass|Energy Crops
      - Primary Energy|Biomass|Modern
    message: Primary Energy|Biomass|Energy Crops
    remind: PE|Production|Biomass|Lignocellulosic|+|Energy Crops
    remind-eu: PE|Production|Biomass|Lignocellulosic|+|Energy Crops
    tiam-ucl: Primary Energy|Biomass|Energy Crops
    gcam: Production|Energy|Biomass|Energy Crops
    witch: Primary Energy|Biomass|1st Generation
  ecoinvent_aliases:
    fltr:
      name: market for wood chips, dry
      reference product: wood chips
    mask:
      - generic
  lhv:
    unit: megajoule
    value: 18.5

