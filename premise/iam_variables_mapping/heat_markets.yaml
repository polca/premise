  limitations:
  - Heat grade, temperature, pressure, quality, technology class, on-site/purchased boundary, source geography,
    vintage, coproduct allocation and internal uncertainty differ. IAM role assumptions and supplier limitations
    remain; score effects are unquantified.
  - Replacing recovered or allocated heat inputs with an IAM mix changes the credit/supply basis. Preserve
    every signed caller quantity; do not alter treatment inputs, emissions or add avoided-emission credits.
  - Native heat/electricity and combustion inventories and all CLIC/helper records stay complete. Native
    steam, environmental heat components and network-only supplies remain historical at this stage. No
    claim of complete heat decarbonization or LCIA equivalence.
