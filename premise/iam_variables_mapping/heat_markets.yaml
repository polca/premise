    limitations:
    - The complete native Swiss district-delivery model proxies other IAM regions. Network density, pipe/infrastructure,
      supply temperature, operating conditions, loss convention, vintage and geography remain native screening
      assumptions; their score effects are unquantified.
    - The original gas-plant identity describes the native prototype before its heat input is replaced
      by the IAM generation mix. Copies receive explicit generic delivery names and source/target provenance.
      No extra distribution, pumping or avoided-heat credit is added.
    - The observed prose loss percentage is not a separately applicable divisor. Preserve the actual inventory
      heat coefficient and the separate transport-network service once. No equivalence to a regional future
      network is claimed.
