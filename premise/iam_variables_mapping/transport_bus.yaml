'bus, fuel cell':
  uvek_aliases:
    use_legacy_templates: false
    fltr:
      name: Transport, passenger bus, fuel cell electric, hydrogen from SMR of natural gas, 13m single
        deck urban bus, 2020
      reference product: Transport, passenger bus, fuel cell electric, hydrogen from SMR of natural
        gas, 13m single deck urban bus, 2020
      unit: person kilometer
    exact: true
    native_reference_amount: 1
    native_limitations:
    - Use the complete native Swiss 2020 13m single-deck urban-bus service per passenger-kilometre as
      a geographic, fleet, operating-pattern and vintage screening proxy through the shared IAM fleet
      and relative-efficiency logic. The source inventory already allocates ten onboard passengers;
      do not apply occupancy, vehicle-km or lifetime a second time.
    - Retain vehicle manufacture, roads, charger or fuelling infrastructure where present, fuel supply
      and all existing maintenance/wear burdens once. Preserve the original per-passenger-kilometre
      basis and use the shared transport update. Native biosphere exclusions and source/scenario score
      differences remain unquantified.
    - Use the complete native fuel-cell bus with its existing 700 bar SMR-hydrogen fuelling supply as
      the baseline representative. The IAM role does not specify the original hydrogen production route.
      Preserve delivered-fuel pressure and the complete supply once; upstream fuel-sector updates are
      separate. No electrolysis credit or second compression burden is added.
  uvek_fuel_aliases:
    fltr:
      name: Hydrogen, gaseous, 700 bar, from SMR of NG, at fuelling station
      unit: kilogram
    exact: true
