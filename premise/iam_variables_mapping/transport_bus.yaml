# mapping between premise and IAM terminology regarding buses
# transport volumes (ES, billion pkm/y) and energy use (FE)
---
'bus, diesel':
  uvek_aliases:
    use_legacy_templates: false
    fltr:
      name: Transport, passenger bus, diesel, 13m single deck urban bus, 2020, EURO-VI
      reference product: Transport, passenger bus, diesel, 13m single deck urban bus, 2020, EURO-VI
      unit: person kilometer
    exact: true
    native_reference_amount: 1
    native_limitations:
    - Use the complete native Swiss 2020 13m single-deck urban-bus service per passenger-kilometre as
      a geographic, fleet, operating-pattern and vintage screening proxy through the shared IAM fleet
      and relative-efficiency logic. The source inventory already allocates ten onboard passengers;
      do not apply occupancy, vehicle-km or lifetime a second time.
    - Retain vehicle manufacture, roads, charger or fuelling infrastructure where present, fuel supply
      and all existing maintenance/wear burdens once. Preserve the original per-passenger-kilometre
      basis and use the shared transport update. Native biosphere exclusions and source/scenario score
      differences remain unquantified.
  uvek_fuel_aliases:
    fltr:
      name: Fuel supply for diesel vehicles
      unit: kilogram
    exact: true
  iam_aliases:
    remind: ES|Transport|Pass|Road|Bus|Liquids
    remind-eu: ES|Transport|Pass|Road|Bus|Liquids
    tiam-ucl: Distance|Transport|Bus|Diesel|Diesel
    image:
      - Energy Service|Transportation|Passenger|Bus|Liquids|Biomass
      - Energy Service|Transportation|Passenger|Bus|Liquids|Fossil
    gcam: Distance|Transport|Pass|Road|Bus|Liquids
  energy_use_aliases:
    remind: FE|Transport|Pass|Road|Bus|Liquids
    remind-eu: FE|Transport|Pass|Road|Bus|Liquids
    tiam-ucl: Final Energy|Transport|Bus|Diesel|Diesel
    image:
      - Final Energy|Transportation|Passenger|Bus|Liquids|Biomass
      - Final Energy|Transportation|Passenger|Bus|Liquids|Fossil
    gcam: Final Energy|Transport|Pass|Road|Bus|Liquids
  ecoinvent_aliases:
    fltr:
      - 'transport, passenger bus, diesel, 13m single deck urban bus, EURO-VI'
  ecoinvent_fuel_aliases:
    fltr:
      - diesel

'bus, gasoline':
  iam_aliases:
    tiam-ucl: Distance|Transport|Bus|Gasoline|Gasoline
  energy_use_aliases:
