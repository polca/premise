      # Shared geographic relinking uses the IAM market after electricity updates.
      name:
      - Electricity, low voltage, at grid
      - market group for electricity, low voltage
      - market for electricity, low voltage
      unit: kilowatt hour
    exact: true
  iam_aliases:
