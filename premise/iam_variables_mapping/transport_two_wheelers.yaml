# mapping between premise and IAM terminology regarding two-wheelers
# transport volumes (ES, billion vkm/y) and energy use (FE)
---

moped, gasoline:
    uvek_aliases:
      use_legacy_templates: false
      fltr:
        name: Transport, Scooter, gasoline, 4-11kW, EURO-5, 2020
        reference product: Transport, Scooter, gasoline, 4-11kW, EURO-5, 2020
        unit: kilometer
      exact: true
      native_reference_amount: 1
      native_limitations:
      - Use the complete native 2020 service, labelled CH, per positive vehicle-kilometre through the existing
        shared regional fleet and relative-efficiency logic. Source geography, vintage, operating pattern
        and class surrogates are screening assumptions; source biosphere exclusions and scenario score differences
        remain unquantified.
      - Preserve the complete published vehicle, road, maintenance and wear inventories once. The reference
        is a vehicle-kilometre, even where documentation lists passenger occupancy; do not apply occupancy,
        a lifetime or a passenger-km conversion again.
      - 'Retain the existing Premise moped-role surrogate: a 4-11 kW scooter. This is not a claim of regulatory
        moped-class equivalence; no new engine displacement or power conversion is inferred.'
      - REMIND reports passenger-kilometres while the shared transport market and these source services
        use vehicle-kilometres. Retain the existing Premise normalized IAM service-share proxy without
        claiming a passenger-to-vehicle distance conversion. Native occupancy differs by class; absolute
        IAM production volumes are not demonstrated vehicle-km totals. Relative-efficiency changes and
        source vehicle-km inventories retain their existing basis; score effects remain unquantified.
    uvek_fuel_aliases:
      fltr:
        name: Fuel supply for gasoline vehicles
        unit: kilogram
      exact: true
    iam_aliases:
        remind: ES|Transport|Pass|Road|LDV|Two Wheelers|Moped|Liquids
        remind-eu: ES|Transport|Pass|Road|LDV|Two Wheelers|Moped|Liquids
    energy_use_aliases:
        remind: FE|Transport|Pass|Road|LDV|Two Wheelers|Moped|Liquids
        remind-eu: FE|Transport|Pass|Road|LDV|Two Wheelers|Moped|Liquids
    ecoinvent_aliases:
        fltr:
            - transport, Scooter, gasoline, 4-11kW, EURO-5
    ecoinvent_fuel_aliases:
        fltr:
            - gasoline

moped, battery electric:
    uvek_aliases:
      use_legacy_templates: false
      fltr:
        name: Transport, Scooter, electric, 4-11kW, NMC battery, 2020
        reference product: Transport, Scooter, electric, 4-11kW, NMC battery, 2020
        unit: kilometer
      exact: true
      native_reference_amount: 1
      native_limitations:
      - Use the complete native 2020 service, labelled CH, per positive vehicle-kilometre through the existing
        shared regional fleet and relative-efficiency logic. Source geography, vintage, operating pattern
        and class surrogates are screening assumptions; source biosphere exclusions and scenario score differences
