      - 'Retain the existing Premise moped-role surrogate: a 4-11 kW scooter. This is not a claim of regulatory
        moped-class equivalence; no new engine displacement or power conversion is inferred.'
      - Use the native NMC variant and its complete battery and charger where present as the representative
        electric baseline. The IAM does not supply a chemistry mix. No extra battery, replacement, charger
        or assumed future capacity factor is added.
      - REMIND reports passenger-kilometres while the shared transport market and these source services
        use vehicle-kilometres. Retain the existing Premise normalized IAM service-share proxy without
        claiming a passenger-to-vehicle distance conversion. Native occupancy differs by class; absolute
        IAM production volumes are not demonstrated vehicle-km totals. Relative-efficiency changes and
        source vehicle-km inventories retain their existing basis; score effects remain unquantified.
    uvek_fuel_aliases:
      fltr:
        name:
        - Electricity, low voltage, at grid
        - market group for electricity, low voltage
        - market for electricity, low voltage
        unit: kilowatt hour
      exact: true
    iam_aliases:
        remind: ES|Transport|Pass|Road|LDV|Two Wheelers|Moped|BEV
        remind-eu: ES|Transport|Pass|Road|LDV|Two Wheelers|Moped|BEV
    energy_use_aliases:
        remind: FE|Transport|Pass|Road|LDV|Two Wheelers|Moped|Electricity
        remind-eu: FE|Transport|Pass|Road|LDV|Two Wheelers|Moped|Electricity
    ecoinvent_aliases:
        fltr:
            - transport, Scooter, battery electric, 4-11kW
    ecoinvent_fuel_aliases:
        fltr:
            - electricity


