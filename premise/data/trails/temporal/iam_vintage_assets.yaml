    callers: ["pulverised lignite production"]
    suppliers: ["market for lignite dust factory", "lignite dust factory construction"]
    product: lignite dust factory
    unit: unit
  - asset: gases-biomass
    callers: ["synthetic natural gas from wood, 70 bar, at plant"]
    suppliers: ["sng from wood, production plant"]
    product: "sng from wood, production plant"
    unit: unit
  # The available coal-to-methane proxy uses coal-derived hydrogen.
  - asset: gases-coal
    callers: ["methane, from coal-based hydrogen"]
    suppliers: ["sabatier reaction methanation unit construction"]
    product: sabatier reaction methanation unit
    unit: unit
  - asset: gases-hydrogen
    callers: ["methane, from electrochemical methanation, with carbon from *"]
    suppliers: ["sabatier reaction methanation unit construction"]
    product: sabatier reaction methanation unit
    unit: unit
  - asset: liquids-oil
    callers:
      - petroleum refinery operation
      - "diesel production,*petroleum refinery operation"
      - "petrol production,*petroleum refinery operation"
      - "kerosene production, petroleum refinery operation"
      - "naphtha production, petroleum refinery operation"
      - "light fuel oil production, petroleum refinery operation"
      - "heavy fuel oil production, petroleum refinery operation"
    suppliers: ["petroleum refinery construction", "market for petroleum refinery"]
    product: petroleum refinery
    unit: unit
  # Use the combined fleet for plant construction on routes without carbon
  # capture. Capture-equipped routes need a separate build-year series.
  - asset: liquids-coal
    callers:
      - "* production, synthetic, fischer tropsch process, hydrogen from coal gasification, energy allocation"
      - "* production, synthetic, fischer tropsch process, hydrogen from coal gasification, economic allocation"
    suppliers: ["gas-to-liquid plant construction"]
    product: gas-to-liquid plant
    unit: unit
  - asset: liquids-gas
    callers:
      - "* production, synthetic, fischer tropsch process, from natural gas, energy allocation"
      - "* production, synthetic, fischer tropsch process, from natural gas, economic allocation"
    suppliers: ["gas-to-liquid plant construction"]
    product: gas-to-liquid plant
    unit: unit
  - asset: liquids-hydrogen
    callers: ["diesel production, synthetic, fischer tropsch process, hydrogen from electrolysis,*"]
    suppliers: ["gas-to-liquid plant construction"]
    product: gas-to-liquid plant
    unit: unit
  - asset: liquids-hydrogen
    callers:
      - "methanol distillation, hydrogen from electrolysis, co2 from dac"
      - "methanol synthesis and distillation, hydrogen from electrolysis, co2 from cement plant"
    suppliers: ["methanol production facility, construction"]
    product: "methanol production facility, construction"
    unit: unit

  # The stationary battery inventory draws from the grid. Use the combined
  # REMIND wind and solar battery fleet as its build-year proxy.
  - asset: battery-total
    callers: ["electricity supply, from stationary battery (cont scenario)"]
    suppliers: ["market for battery capacity, stationary (cont scenario)"]
    product: electricity storage capacity
    unit: kilowatt hour

# Some construction inventories split one asset into several installation
# exchanges. These inputs inherit the date when the same asset is IAM-dated.
# The old timing on these inputs is still used on routes with no IAM build date.
construction_pass_through:
  - callers: ["*coal igcc power plant 450mw", "*lignite igcc power plant 450mw"]
    suppliers: ["construction, * igcc power plant 450mw"]
  - callers: ["photovoltaic installation construction,*", "photovoltaic plant construction,*"]
    suppliers: ["electric installation production, utility scale, open ground"]
  - callers: ["electric installation production, utility scale, open ground"]
    suppliers: ["building construction, hall, steel construction"]
  - callers: ["geothermal power plant construction"]
    suppliers: ["deep well drilling, for deep geothermal power", "heat and power co-generation unit construction, 1mwel, 6.4 mwth"]
  - callers: ["heat and power co-generation unit construction, 1mwel, 6.4 mwth"]
    suppliers: ["building construction, hall"]
  - callers: ["building construction, hall"]
    suppliers: ["building construction, hall, steel construction", "building construction, hall, wood construction"]
  - callers: ["concentrated solar power plant construction,*"]
    suppliers:
      - "collector field area construction,*"
      - "heat transport fluid system construction,*"
      - "power block installation,*"
      - "thermal storage system construction,*"
  - callers: ["methanol production facility, construction"]
    suppliers: ["chemical factory construction, organics"]
  - callers: ["chemical factory construction, organics"]
    suppliers: ["building construction, multi-storey", "chemical factory construction"]
  - callers: ["passenger bus, diesel,*", "lorry production, diesel,*"]
    suppliers: ["fuel tank, for diesel vehicle"]
  - callers: ["passenger car, fuel cell electric,*"]
    suppliers: ["fuel tank, compressed hydrogen gas, 700bar, with hdpe liner"]
