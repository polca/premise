# Existing TRAILS construction profile IDs mapped to asset IDs in the vintage table.
# Where a default profile covers several fleets, match the actual vehicle or
# producing activity as well. Name patterns are lowercase glob patterns.
construction_profiles:
  eia-us-solar-photovoltaic-construction-vintage-2025: pv
  eia-us-onshore-wind-construction-vintage-2025: wind-onshore
  gem-gwpt-united-kingdom-offshore-fixed-structure-vintage-2026: wind-offshore
  gem-gwpt-germany-offshore-fixed-structure-vintage-2026: wind-offshore
  gem-gwpt-china-offshore-fixed-structure-vintage-2026: wind-offshore
  gem-gwpt-europe-offshore-fixed-structure-vintage-2026: wind-offshore
  gem-gwpt-world-offshore-fixed-structure-vintage-2026: wind-offshore
  gem-gspt-spain-csp-construction-vintage-2026: csp
  gem-gspt-united-states-csp-construction-vintage-2026: csp
  gem-gspt-south-africa-csp-construction-vintage-2026: csp
  gem-gspt-world-csp-construction-vintage-2026: csp
  eia-us-conventional-hydropower-construction-vintage-2025: hydro
  eia-us-nuclear-construction-vintage-2025: nuclear
  eia-us-geothermal-construction-vintage-2025: geothermal
  eia-us-wood-biomass-construction-vintage-2025: biomass-chp
  gem-gbpt-europe-wood-biomass-construction-vintage-2026: biomass-chp
  gem-gbpt-world-wood-biomass-construction-vintage-2026: biomass-chp
  eia-us-natural-gas-combustion-turbine-construction-vintage-2025: gas-turbine
  eia-us-natural-gas-combined-cycle-construction-vintage-2025:
    - asset: ccgt-ccs
      callers:
        - "*combined cycle*with ccs*"
        - "*combined cycle*w/ ccs*"
        - "*combined cycle*with carbon capture*"
        - "*combined cycle*with co2 capture*"
    - asset: ccgt
  dft-uk-battery-electric-car-construction-vintage-2025: passenger-ldv-4w-bev
  dft-uk-fuel-cell-electric-car-construction-vintage-2025: passenger-ldv-4w-fcev
  dft-uk-gasoline-car-construction-vintage-2025: passenger-ldv-4w-liquids
  dft-uk-diesel-car-construction-vintage-2025: passenger-ldv-4w-liquids
  dft-uk-gasoline-hybrid-car-construction-vintage-2025: passenger-ldv-4w-hybrid
  dft-uk-diesel-hybrid-car-construction-vintage-2025: passenger-ldv-4w-hybrid
  dft-uk-gas-car-construction-vintage-2025:
    - asset: passenger-ldv-4w-gases
      suppliers: ["passenger car, compressed gas,*"]
  eu-road-bus-construction-vintage-2024:
    - asset: buses-bev
      suppliers: ["passenger bus, battery electric*"]
    - asset: buses-fcev
      suppliers: ["passenger bus, fuel cell electric,*"]
    - asset: buses-gases
      suppliers: ["passenger bus, compressed gas,*"]
    - asset: buses-liquids
      suppliers: ["passenger bus, diesel,*", "passenger bus, gasoline,*"]
  eu-road-light-commercial-construction-vintage-2024:
    - asset: light-trucks-bev
      suppliers: ["lorry production, battery electric, 3.5 metric ton*"]
    - asset: light-trucks-fcev
      suppliers: ["lorry production, fuel cell electric, 3.5 metric ton*"]
    - asset: light-trucks-gases
      suppliers: ["lorry production, compressed gas, 3.5 metric ton*"]
    - asset: light-trucks-liquids
      suppliers: ["lorry production, diesel, 3.5 metric ton*"]
  eu-road-lorry-over-3.5t-construction-vintage-2024:
    - asset: heavy-trucks-bev
      suppliers:
        - lorry production, battery electric, 26 metric ton*
        - lorry production, battery electric, 32 metric ton*
        - lorry production, battery electric, 40 metric ton*
        - lorry production, battery electric, 60 metric ton*
    - asset: heavy-trucks-fcev
      suppliers:
        - lorry production, fuel cell electric, 26 metric ton*
        - lorry production, fuel cell electric, 32 metric ton*
        - lorry production, fuel cell electric, 40 metric ton*
        - lorry production, fuel cell electric, 60 metric ton*
    - asset: heavy-trucks-gases
      suppliers:
        - lorry production, compressed gas, 26 metric ton*
        - lorry production, compressed gas, 32 metric ton*
        - lorry production, compressed gas, 40 metric ton*
        - lorry production, compressed gas, 60 metric ton*
    - asset: heavy-trucks-liquids
      suppliers:
        - lorry production, diesel, 26 metric ton*
        - lorry production, diesel, 32 metric ton*
        - lorry production, diesel, 40 metric ton*
        - lorry production, diesel, 60 metric ton*

# Match the operating activity and its construction input directly. Use the
