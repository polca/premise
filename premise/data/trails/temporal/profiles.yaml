    assumptions:
    - The length-weighted age distribution of operating transmission-pipeline phases is used as the construction-vintage
      distribution of pipeline infrastructure serving current transport.
    - Merged reported or route-estimated pipeline length is used because the ecoinvent capital exchange
      is measured in kilometres; throughput and capacity utilisation are not observed.
    - Only operating phases are included; planned, cancelled, idle, mothballed, and retired phases are
      excluded.
    - Where a phase has multiple valid start years, the earliest is used as the original construction
      year because the source does not allocate phase length among later expansions or recommissioning
      dates.
    - Only four-digit start years from 1800 through the source reference year are accepted; phases without
      a valid start year are excluded and known-age length is renormalised.
    - The European profile follows the source start-region classification; cross-region length is not
      split between regions.
    - The trackers cover transmission pipelines and exclude distribution and gathering networks, matching
      the activated long-distance transport relationships.
    - Repairs, replacement sections, reversals, and refurbishment do not reset the reported original start
      year unless represented as a separate source phase.
    - The profile describes operating stock composition and must not be interpreted as prospective service
      life.
