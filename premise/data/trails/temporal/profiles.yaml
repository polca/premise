      reported known shares renormalised.
    - Closed periods use midpoint construction years; pre-1919 is represented by 1900 and 2022-onwards
      by mid-2022 to 2023. These tail representatives are modelling assumptions.
    - The building stock is a proxy for shell-dominated photovoltaic-cell-factory capital and for metal-coating
