    assumptions:
    - The EU27 commercial-aircraft stock-age distribution is used as a proxy for construction vintages
      of passenger aircraft providing current transport service.
    - Closed age bands are represented at ages 2, 7, 12, and 17 years.
    - The open 20-years-or-over band is represented at age 22.5 years; this yields an 11.9-year mean,
      close to EASA's independently reported 11.8-year European fleet mean for 2023.
    - Eurostat combines commercial aircraft categories, so the distribution is not specific to passenger
      aircraft; dedicated freighters are excluded because EASA reports a much older cargo fleet.
    - Belly freight uses the passenger-aircraft profile because it is carried in passenger aircraft rather
      than dedicated freighters.
    - Aircraft counts are not weighted by seats, payload, flights, passenger-kilometres, or tonne-kilometres,
      and one common profile is used across haul classes.
    - All compatible ecoinvent aircraft-transport callers are global, so EU27 evidence is an explicit
      geographic proxy rather than a direct match.
    - The profile describes observed stock composition and must not be interpreted as prospective service
      life or an attribution-based production profile.
