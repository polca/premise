        - 0.48
        - 0.27
        - 0.2
        - 0.12
        - 0.06
        - 0.04
        right_censored_after_years: 19
    applicability:
      geographies:
      - Europe
      vehicle: passenger car
    assumptions:
    - The underlying UK MOT inspection population is used by the source as a proxy for the wider European
      fleet.
    - Four percent of vehicles remain at the final reported age; the tail is right-censored and no unsupported
      retirement age is assigned.
    - The source does not provide powertrain-specific survival curves.
    evidence:
      status: empirical
      source_ids:
      - ec-light-duty-vehicle-survival-2015
      population: United Kingdom vehicles represented in MOT periodic-inspection records.
      weighting: Source-reported vehicle survival share by age.
      reference_period: Source evaluation published 2015; underlying observation period not reported in
        the extracted table.
      censoring: Right-censored after age 19 with four percent surviving.
      sample_size:
        not_reported: The source table does not report the underlying vehicle count.
        unit: vehicles
      quality_flags:
      - geographic-proxy
      - right-censored
      coverage:
        source_population: United Kingdom MOT periodic inspection records
        reported_age_years:
        - 1
        - 19
        last_reported_survival_probability: 0.04
    review:
      activation_status: evidence_only
      rationale: The curve is a UK proxy and cannot produce an uncensored mean lifetime without a reviewed
        tail model.
