  unctad-global-bulk-carrier-construction-vintage-2024:
    quantity: construction_timing
    reference_event: current_service
    distribution:
      kind: discrete
      offsets_years: &id001
      - -30.214285714
      - -17
      - -12
      - -7
      - -2
      weights:
      - 0.08
      - 0.12
      - 0.39
      - 0.21
      - 0.2
    applicability:
      evidence_geographies:
      - World
      reference_year: 2024
      technology: bulk carriers
    assumptions:
    - The operating-fleet age distribution is used as the construction-vintage distribution of vessels
      serving current freight transport.
    - Deadweight-tonnage shares are used because ecoinvent marine transport is expressed per tonne-kilometre.
    - The published age-band percentages are rounded and are normalized to sum to one.
    - Closed age bands use their midpoints; the open over-20 band uses 30.214 years, calibrated so the
      published global deadweight-tonnage bands reproduce the reported 12.5-year overall mean.
    - The common open-tail representative age is applied to each ship type because type-specific within-band
      ages are not published.
    - Major retrofits and component replacements are not separated from original vessel construction.
    - The profile describes existing fleet composition and must not be interpreted as prospective service
      life.
    evidence:
      status: empirical
      source_ids:
      - unctad-review-maritime-transport-2024
      population: Propelled seagoing vessels of 100 gross tons and above in the world fleet on 1 January
        2024.
      weighting: Share of deadweight tonnage in each age band.
      reference_period: '2024-01-01'
      censoring: Operating vessels are right-censored with respect to eventual retirement; the oldest
        band is open-ended.
      sample_size:
        not_reported: The published figure reports rounded deadweight-tonnage shares rather than vessel
          counts by type and age band.
        unit: vessels
      quality_flags:
      - deadweight-tonnage-weighted
      - surviving-fleet
      - rounded-age-band-shares
      - open-tail-modelled
      coverage:
        technology: bulk carriers
        age_band_shares_percent_oldest_first:
        - 8
        - 12
        - 39
        - 21
        - 20
        representative_ages_years_oldest_first: &id002
        - 30.214285714
        - 17
        - 12
        - 7
        - 2
        derived_mean_age_years: 11.007143
    review:
      activation_status: active
      rationale: The transport-to-whole-vessel relationship was audited across ecoinvent 3.8-3.12.
