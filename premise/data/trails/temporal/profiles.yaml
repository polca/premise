  bernmobil-ch-pantograph-site-vintage-2026:
    quantity: construction_timing
    reference_event: current_service
    distribution:
      kind: discrete
      offsets_years:
      - -7.0
      - -3.0
      - -1.0
      weights:
      - 0.333333333333
      - 0.333333333333
      - 0.3333333333339999
    applicability:
      evidence_geographies:
      - Bern area, Switzerland
      reference_year: 2026
      technology: bus-terminus pantograph opportunity-charging infrastructure
      proxy_policy: Use as an explicit geographic or inventory-technology proxy only while no stronger matching
        evidence is available.
    assumptions:
    - 'Use first regular electric-service years as proxies for site construction: Weiermatt 2019, Stuckishaus
      2023 and Blinzern 2025. The operator confirms pantograph opportunity charging on all three routes.'
    - ABB dates the line-17 pilot to December 2018 and identifies 450 kW charging; the operator dates regular
      pilot operation from 2019. The regular-service convention introduces up to one year of dating uncertainty.
    - The line-19 Elfenau site remains blocked by objections and is excluded; depot overnight chargers,
      vehicle counts and planned sites are excluded.
    - The three sites are a small, geographically concentrated convenience sample. Equal site weighting
      and transfer to all 450 kW pantograph inventory designs are modelling assumptions; the later two sites'
      ratings and module counts are not established by these sources.
    - Current project pages establish operating sites but not uninterrupted survival of the original equipment.
      Site first service does not identify later charger replacement or refurbishment.
    - The observed age shape is reused for other service years; no scenario-specific future stock, retirement
      or utilisation model is inferred.
    - Fleet construction timing does not establish prospective service life or lifetime-service attribution.
      Exchange amounts remain unchanged.
    evidence:
      status: modelled
      source_ids:
      - bernmobil-opportunity-charging-system
      - bernmobil-opportunity-charging-line-17
      - bernmobil-opportunity-charging-line-21
      - bernmobil-opportunity-charging-line-19
      - abb-bernmobil-pantograph-pilot-2020
      population: Three documented operating pantograph-charging sites serving BERNMOBIL routes 17, 21 and
        19; not a national or European fleet census.
      weighting: Equal weight per documented terminus site, not per bus, charging connector, equipment module,
        power or service output.
      reference_period: '2026'
      censoring: Only documented operating sites are included; planned Elfenau and depot chargers are excluded.
        Equipment replacements within a site are unobserved.
      sample_size:
        count: 3
        unit: documented operating terminus sites
        minimum_for_generalisation: 30
      quality_flags:
      - small-sample
      - site-count-weighted
      - first-service-year-proxy
      - swiss-geographic-proxy
      - 450kw-rating-transfer
      - replacement-dates-unobserved
      coverage:
        site_cohorts:
        - site: Köniz, Weiermatt
          route: '17'
          first_service_year: 2019
          source_id: bernmobil-opportunity-charging-line-17
        - site: Bremgarten, Stuckishaus
          route: '21'
          first_service_year: 2023
          source_id: bernmobil-opportunity-charging-line-21
        - site: Köniz, Blinzern
          route: '19'
          first_service_year: 2025
          source_id: bernmobil-opportunity-charging-line-19
        excluded_planned_sites:
        - Bern, Elfenau (line 19)
        derived_mean_age_years: 3.666667
    review:
      activation_status: active
      rationale: Activate as a transparent small-sample European technology proxy while no representative
        pantograph equipment-vintage register is available. Stronger local evidence can override this low-priority
        assignment.
  reviewed-truck-allocated-charger-construction-event:
    quantity: construction_timing
    reference_event: construction
    distribution:
      kind: fixed
      offset_years: 0
    applicability:
      technology: 200 kW plug-in charger allocated within new electric/hybrid truck production
    assumptions:
    - The truck workbook allocates fractions of a shared charger to new-truck production rather than directly
      to current freight service. Preserve that inventory placement and all amounts.
    - Date the allocated charger in the parent truck construction year, at annual resolution. When a truck
      fleet-age profile dates vehicle production from freight service, this charger inherits that date without
      a second age shift.
    - This is a construction-event convention, not a measured charger fleet age or a claim that truck and
      shared charger are physically co-manufactured. Independent charger commissioning and replacement cannot
      be recovered from this allocation.
    - Direct transport-service charger inputs retain their independent reviewed fleet profiles. Changing
      the shared-infrastructure service allocation is outside this timing correction.
    - Prospective service life, exchange amounts and inventory topology are unchanged.
    evidence:
      status: assumption
      source_ids:
      - trails-truck-charger-inventory-placement
      - trails-construction-event-convention
      quality_flags:
      - allocated-shared-infrastructure
      - construction-year-convention
      - independent-charger-vintages-unresolved
    review:
      activation_status: active
      rationale: Replace a legacy lifetime-shaped offset against new-truck construction with an explicit
        zero additional construction offset; preserve the supplied inventory allocation.
