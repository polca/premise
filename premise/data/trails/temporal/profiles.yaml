  reviewed-new-asset-construction-substep:
    quantity: construction_timing
    reference_event: construction
    distribution:
      kind: fixed
      offset_years: 0
    assumptions:
    - Selected components supplied to explicit new-vehicle assembly, photovoltaic installation, and CHP
      construction occur in the parent construction year.
    - Selected markets supplying these same construction products add no further fleet-age offset.
    - This is an annual-resolution timing convention, not empirical fleet-age evidence; manufacturing
      lead times within or before the construction year are unavailable.
    - Whole operating assets receive fleet-age profiles at the service-to-asset link. A component of their
      construction does not receive a second whole-fleet age shift.
    - Operating factories, charging infrastructure, replacement and maintenance events are excluded from
      these assignments.
    - Exchange amounts and prospective service lives are unchanged.
    evidence:
      status: assumption
      source_ids:
      - trails-construction-event-convention
    review:
      activation_status: active
      rationale: Relationship-specific construction substeps replace legacy lifetime-based offsets without
        inventing a component fleet or applying fleet age twice.
