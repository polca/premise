    applicability:
      evidence_geographies:
      - EU28
      reference_year: 2012
      technology: natural-gas building boilers
    assumptions:
    - The source reports the installed-capacity composition of the surviving EU28 building-heating stock
      in reference year 2012.
    - Rounded whole-percentage shares were transcribed from Figure 5; the study combines empirical inputs
      with bottom-up modelling where observations are missing.
    - Installed capacity is not heat-output, utilisation, or unit-count weighting.
    - The evidence describes operating-stock age and must not be interpreted as prospective service life.
    - Original installation age is retained because refurbishment and component replacement are not separately
      observed.
    - The open pre-1992 band is retained without an unsupported upper age.
