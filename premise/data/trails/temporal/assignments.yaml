schema_version: 1
assignments:
- id: reviewed-us-eia-onshore-wind-construction-vintage
  profile: eia-us-onshore-wind-construction-vintage-2025
  target: supplier
  kind: selector
  priority: 100
  caller_match:
    all:
    - {field: name, operator: startswith, value: "electricity production, wind,", case_sensitive: false}
    - {field: location, operator: glob, value: "US-*", case_sensitive: false}
  caller_exclude:
    any:
    - {field: name, operator: contains, value: offshore, case_sensitive: false}
  exchange_match:
    any:
    - {field: name, operator: glob, value: "wind turbine, *", case_sensitive: false}
    - {field: name, operator: glob, value: "wind power plant, *", case_sensitive: false}
  applicability:
    ecoinvent_versions: ["3.8", "3.9", "3.9.1", "3.10", "3.10.1", "3.11", "3.12"]
  expected_matches: {minimum: 1}
