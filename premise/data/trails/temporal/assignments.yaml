- id: reviewed-wind-electricity-service-life
  profile: nrel-wind-technical-life-30-years
  target: activity
  kind: selector
  priority: 100
  match:
    all:
    - field: name
      operator: startswith
      value: electricity production, wind,
      case_sensitive: false
    - field: reference product
      operator: startswith
      value: electricity,
      case_sensitive: false
    - field: unit
      operator: equals
      value: kilowatt hour
  applicability:
    ecoinvent_versions: ["3.8", "3.9", "3.9.1", "3.10", "3.10.1", "3.11", "3.12"]
  expected_matches:
    minimum: 1
