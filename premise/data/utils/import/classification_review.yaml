schema_version: 1
review_date: '2026-11-15'
scope:
  case: ecoinvent 3.12 cutoff / IMAGE SSP2-M 2050 default imports
  observed_warning_count: 223
  distinct_missing_pairs: 221
  related_legacy_entries: Existing exact-product aliases of reviewed products; rechargeable module and
    installed-capacity references.
  runtime_matching: Exact activity/product entries in classifications.csv; this review file is provenance,
    not runtime selection logic.
sources:
  cpc21_structure:
    url: https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_2_1_english_structure.txt
    sha256: 1c3e88e5fa67b9ba0d27594cb3363f717321f58fe0308be60b326ebf927c1b92
  cpc21_explanatory_notes:
    url: https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_2.1_Exp_Notes_Updated_3Apr2025.xlsx
    sha256: 95dcca76a0d94e281e4c3c82f53ee43331a707f9177ff5527733426189cdb7b2
  isic4_structure:
    url: https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/ISIC_Rev_4_english_structure.txt
    sha256: 18b645efc5a0b001fda5852cfd0690eb579011651e405631e50cb2d271ee2cc6
  cpc21_isic4_correspondence:
    url: https://unstats.un.org/unsd/classifications/Econ/tables/CPC/CPCv21_ISIC4/cpc21-isic4.txt
    sha256: 0272188c086fb5d8efa3923749cc7b5a1bd5a12e7719843d26c2f2b38ea2f392
  isic4_electronic_components:
    url: https://unstats.un.org/unsd/classifications/Econ/Detail/EN/27/2610
limitations:
- Classifications describe the declared LCI outputs. Process completeness, technology performance,
  hazard status and waste fate are outside this metadata review.
- Capacity, throughput, service-package, area and lifetime-allocation denominators are preserved. Product
  classification does not convert them into physical kilograms or operating electricity.
- Parent categories are retained for mixed bundles or where a narrower delivery form, voltage, disposal
  route or geometry is not supported.
- The two control-board/connector groups use ISIC 2610 activity definitions explicitly despite the generic
  CPC correspondence listing 2710; their rationales document the distinction.
