- id: uvek-2026-ruthenium-za-native-allocated-template
  file: lci-PGM.xlsx
  workbook_sha256: 29e75f2d37ba8788549a4633abff750dbae2a672e2b7ffd07dd679b90f4c26c6
  activity:
  - platinum group metal, extraction and refinery operations
  - ruthenium
  - ZA
  - kilogram
  source:
    technosphere:
      family: ecoinvent
      version: '3.8'
      system_model: cutoff
    biosphere:
      family: ecoinvent
      version: '3.8'
  target: &id001
    technosphere:
      family: uvek
      version: '2026'
      system_model: cutoff
    biosphere:
      family: ecoinvent
      version: '3.10'
  donor:
  - Platinum, primary, at refinery
  - Platinum, primary, at refinery
  - ZA
  - kilogram
  factors:
    technosphere: 0.44653047651577316
    biosphere: 0.5158944340327865
  retain_source_biosphere:
  - source:
      type: biosphere
      name: Ruthenium, in ground
      unit: kilogram
      categories:
      - natural resource
      - in ground
    amount: 1
  exclude_donor_biosphere:
  - type: biosphere
    name: Platinum
    unit: kilogram
    categories:
    - natural resource
    - in ground
  evidence:
    source_parent:
      name: platinum group metal, extraction and refinery operations
      reference product: platinum
      location: ZA
      unit: kilogram
      code: 7b3bd318ca92108334f86431cf0f24d9
    source_parent_technosphere_coordinates_verified: 8
    source_parent_nonmetal_biosphere_coordinates_verified: 54
    source_parent_common_nonmetal_coordinates_constant_scaled: true
    donor_metadata_sha256: c56202859dad27428c97f62ae695931190ac61b04aa7fa0504a70f6aa62c9f22
    donor_inventory_sha256: dafda8307411f6c4978476dea40368e9d66b3411ac4f90e4db08170456f1ed6b
    basis: Separate source-observed technosphere and nonmetal-biosphere factors. The source foreground
      retains only its own-metal resource; replace the donor direct Platinum resource, not a copper-concentrate
      intermediary.
  limitations:
  - Screening proxy with unquantified score differences. The documented allocation factors represent
    attributed burdens, not a physical production yield.
  - Replace the complete legacy process inventory with the reviewed native process template. Original
    exchanges remain in the owned audit. Native technology, co-production allocation, upstream supply,
    water/land/emission models, vintage and internal uncertainty replace the source model; signed
    caller quantities and the positive one-kg foreground output remain unchanged. Native-source biosphere
    exclusions remain inherited limitations.
  - The source-derived scaling is the observed relation to the stated source parent, not a current
    price ratio, an extra recovery credit or an assumption that the same allocation is scientifically
    optimal for UVEK. Preserve native exchange signs and scale supported uncertainty; retain the original
    one-kg own-metal resource explicitly. Effects on scores are unquantified.
  - The native complete primary-platinum process includes mining, beneficiation and refining; ZA and
    RU use their existing country-labelled processes. Their documentation includes UCTE electricity
    assumptions. Do not repair that upstream geography silently or add the original source refinery/concentrate
    inputs again.
  - The native publisher recommends more detailed PGM modelling when PGM contributions matter. These
    processes remain screening proxies with that explicit applicability limitation. Retain the source
    allocation construction; narrative allocation percentages alone do not reproduce the actual workbook
    factors.
  - The South African ruthenium workbook uses different technosphere and nonmetal-biosphere factors;
    do not collapse them into a single multiplier.
  - Removing the donor direct platinum depletion standardizes direct own-metal attribution. The original
    South African concentrate chain can carry upstream coupled-metal resources; equality of full source/native
    upstream resource balances is not established.
