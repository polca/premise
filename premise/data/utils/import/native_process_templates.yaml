    basis: The source parent explicitly describes 59% zinc by mass. Native documentation explicitly
      references 1 kg of metal contained in the unrefined product and excludes further refining. Multiply
      the observed source-parent factor by that documented source metal content, not by an inferred
      concentrate density or smelter yield.
  limitations:
  - Screening proxy with unquantified score differences. The documented allocation factors represent
    attributed burdens, not a physical production yield.
  - Replace the complete legacy process inventory with the reviewed native process template. Original
    exchanges remain in the owned audit. Native technology, co-production allocation, upstream supply,
    water/land/emission models, vintage and internal uncertainty replace the source model; signed
    caller quantities and the positive one-kg foreground output remain unchanged. Native-source biosphere
    exclusions remain inherited limitations.
  - The source-derived scaling is the observed relation to the stated source parent, not a current
    price ratio, an extra recovery credit or an assumption that the same allocation is scientifically
    optimal for UVEK. Preserve native exchange signs and scale supported uncertainty; retain the original
    one-kg own-metal resource explicitly. Effects on scores are unquantified.
  - The source parent explicitly describes 59% zinc by mass. Native documentation explicitly references
    1 kg of metal contained in the unrefined product and excludes further refining. Multiply the observed
    source-parent factor by that documented source metal content, not by an inferred concentrate density
    or smelter yield.
  - Use the complete Swedish combined-metal mining and beneficiation process as an explicit geographical,
    ore, joint-production, allocation, vintage and technology proxy for the source mining route. This
    replaces its country/global process model and retains native coupled-metal resource attribution;
    it does not add physical copper or zinc to the foreground output, final-metal refining, an avoided-mining
    credit or another mine inventory.
  - The source germanium inventory also changes three recycled-material handovers relative to its
    parent. Their source exchanges are retained in the audit; the complete native process replaces
    those internal supply/disposal choices rather than pretending they match the parent exactly.
