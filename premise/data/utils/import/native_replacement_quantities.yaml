  file: lci-steel.xlsx
  source_version: '3.9'
  target:
    technosphere:
      family: uvek
      version: '2026'
      system_model: cutoff
    biosphere:
      family: ecoinvent
      version: '3.10'
  activity:
  - pig iron production, blast furnace, with carbon capture and storage
  - pig iron
  - GLO
  - kilogram
  replacement_source:
  - pig iron production
  - pig iron
  - RER
  donor:
  - Pig iron, at plant
  - Pig iron, at plant
  - RER
  - kilogram
  donor_reference_amount: 1
  authorization: Standing user instruction to work autonomously and auto-approve modelling decisions
    with warnings and review logs.
  limitations:
  - Fill only explicitly declared workbook placeholders using the standard Premise replacement-quantity
    operation. Retain all explicit non-placeholder exchanges, including slag and capture, unchanged.
  - This samples the corresponding input groups of the historical native RER pig-iron donor. It neither
    reproduces the ecoinvent production inventory nor copies every additional native input; source/native
    technology, allocation, fuel, ore grade, geography and emissions differ, with unquantified score
    effects.
  - Native trace-element ionic labels are retained at their native signed kg quantities; no molecular-weight
    conversion or claim of equal chemical definitions is made.
  - Natural gas is taken in the native MJ unit directly from the donor. Do not treat the unknown
    source m3 placeholder as a known amount or introduce a density/energy multiplier.
  - Source slots absent from the native donor are specifically listed below and omitted with warnings.
    Unknown quantities are not reported as measured zero.
  - Repeated source geography slots mapping to one native supplier group must be filled once, preserving
    the actual native supplier structure.
  - Source placeholders are deterministic. The shared filler transfers native amounts,
    not the donor exchange uncertainty distributions; upstream supplier inventories remain
    unchanged. Do not claim equal source and native uncertainty.
