- file: lci-steel.xlsx
  source_version: '3.9'
  target:
    technosphere:
      family: uvek
      version: '2026'
      system_model: cutoff
    biosphere:
      family: ecoinvent
      version: '3.10'
  donor_reference_amount: 1
  authorization: Standing user instruction to work autonomously and auto-approve modelling decisions
    with warnings and review logs.
  id: uvek-2026-native-steel-fill-2
  activity:
  - steel production, blast furnace-basic oxygen furnace, low-alloyed
  - steel, low-alloyed
  - GLO
  - kilogram
  replacement_source:
  - steel production, converter, low-alloyed
  - steel, low-alloyed
  - RER
  donor:
  - Steel, converter, low-alloyed, at plant
  - Steel, converter, low-alloyed, at plant
  - RER
  - kilogram
  limitations:
  - Use the corresponding input groups of the selected historical native donor through the unchanged
    Premise placeholder filler. Preserve all explicit non-placeholder exchanges, reference output,
    units, signs, capture services and coproduct entries; do not normalize the borrowed ingredient
    quantities.
  - This is a screening model, not an ecoinvent inventory reconstruction or a complete copy of the
    native donor. Fuel/ore/alloy grades, regional supply, allocation, infrastructure, residue and
    emission models differ; the score effects are unquantified. Additional native inputs outside
    the declared source slots are not silently added.
  - Source quantities in these slots are unknown licensed-data placeholders. Native absence is an
    explicitly recorded omission, not a measured source zero or evidence of negligible effect.
  - Borrow native gas quantities in their actual MJ unit and native ore/alloy quantities in their
    actual reference bases; do not introduce density, purity, metal-content or heating-value multipliers
    for an unknown source quantity.
  - Native ionic trace-element labels and particle labels remain in their installed biosphere identities
    and native units. No molecular-weight conversion or equality of chemical definitions is asserted.
  - Duplicate source geography slots and joint residue-basket selectors are filled once per actual
    donor input group by the standard Premise filler. Native repeated coefficients are retained individually
    once.
  - Source placeholders are deterministic. Donor quantities are copied; donor exchange uncertainty
    distributions are not transferred. Upstream supplier inventories remain unchanged.
  - The selected native source already excludes unsupported biosphere exchanges documented in its
    original import audit. This lookup mapping does not restore those exclusions.
  - The dust and sludge lookup slots jointly select the existing native converter waste-treatment
    basket, including its BOF-waste landfill and EAF-dust landfill proxy. This changes source residue
    composition, moisture, treatment and emission assumptions; it does not assert that sludge, BOF
    dust and EAF dust are identical. The complete selected basket is copied once, with no invented
    sludge/dust split.
  - The source explicit BOF-slag/coproduct input remains unchanged. Borrowed native residue quantities
    and that source allocation term retain different boundaries; no claim of equal source/native
    residue balance or allocation is made.
  - Where present, native compressed air is an average <30 kW, 8 bar-gauge service, differing from
    the source 600 kPa-gauge lookup. Use its donor quantity unchanged; do not invent a pressure ratio
    or compressor efficiency correction.
