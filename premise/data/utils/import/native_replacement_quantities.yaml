    world-average inputs and EU-derived air emissions are a geographic, vintage and allocation screening
    proxy for the original ecoinvent RER donor, not source-inventory equivalence.
  - The initially selected native RER lookup subset supplies only about 4.81 MJ of direct counted
    energy per kg and fails the shared minimum check. The original publisher archive confirms its
    stored quantities and units, so no guessed kg/MJ or gas-volume correction is applied. The global
    donor has a documented conventional blast-furnace boundary and coherent declared direct fuel
    demand; it is selected as a functional process counterpart, without altering any native database.
  - Copy all sixteen actual global donor technosphere inputs, including its complete inbound procurement
    freight basket once. Only the unknown base-process slots are adapted. Explicit source slag and
    CO2-capture inputs and all other explicit source exchanges remain unchanged. No empirical fuel
    multiplier or arbitrary minimum-energy correction is introduced.
  - The source capture quantity remains unchanged while the borrowed baseline direct CO2 differs,
    so the effective capture fraction differs from the original source assumption. Do not silently
    recalibrate capture performance, add recovery credits or assert equal source/native allocation
    or carbon balances.
  - Native ionic trace-element labels and full compartments remain as installed. No molecular-weight,
    purity, density or inferred heating-value factor is introduced for an unknown source quantity.
    Unknown native-absent source slots are explicit warned omissions, not measured zero.
  - Duplicate source geography slots are filled once per actual native group by the standard Premise
    filler. Source placeholders are deterministic; donor quantities are copied but donor exchange
    uncertainty distributions are not transferred. Upstream inventories and existing native-source
    biosphere exclusions remain unchanged.
