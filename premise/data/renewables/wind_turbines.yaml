    limitations: The existing Premise renewable update creates preparatory direct-drive variants
      by copying complete native wind inventories; this step does not recalculate their material
      composition or remove a gearbox. Native generators cover different turbine designs, capacities,
      rotor/tower/substructure boundaries, lifetime and geography. A direct-drive label alone does
      not establish a direct-drive bill of materials; subsequent technology/material updates require
      their own reviewed mappings. Keep every signed coefficient, formula and supported uncertainty.
      Relink only the explicitly selected native turbine components; retain substations, grid connections,
      factories, transport, disposal and all other infrastructure unchanged. No extra generator,
      lifetime conversion, loss multiplier or metal credit is invented. These are screening templates
      with unquantified score effects, not verified technology-specific LCIA equivalents.
