schema_version: 1
target_versions:
- '3.12'
system_models:
- cutoff
- EN15804
rules:
- id: onboard-charger
  review_status: reviewed
  match:
    names:
    - charger production, road vehicle, onboard
    unit: kilogram
  suppliers:
  - name: charger production, for electric passenger car
    product: charger, electric passenger car
    unit: kilogram
    locations:
    - GLO
  conversion: One kilogram of native onboard charger per kilogram of requested charger.
  limitations: Passenger-car charger used for other road-vehicle classes; power rating, design year and material
    composition can differ. Manufacturing only; does not add use-phase electricity.
  evidence:
  - 'Native ecoinvent 3.12 dataset documentation: charger production, for electric passenger car (GLO), functional
    unit kilogram.'
  - https://support.ecoinvent.org/licensing
  confidence: medium
- id: auxiliary-dc-converter
  review_status: reviewed
  match:
    names:
    - converter production, road vehicle, auxiliary dc
    unit: kilogram
  suppliers:
  - name: converter production, for electric passenger car
    product: converter, for electric passenger car
    unit: kilogram
    locations:
    - GLO
  conversion: One kilogram of native automotive converter per kilogram of requested converter.
  limitations: Native reference is a 4.5 kg device suitable for a 100 kW electric drivetrain; auxiliary converter
    voltage, rating and design may differ. Mass-normalized manufacturing proxy; no use-phase efficiency is inferred.
  evidence:
  - 'Native ecoinvent 3.12 dataset documentation: converter production, for electric passenger car (GLO), functional
    unit kilogram.'
  - https://support.ecoinvent.org/licensing
  confidence: medium
- id: pv-residential-electricity
  review_status: reviewed
  match:
    names:
    - electricity production, photovoltaic, residential
    unit: kilowatt hour
  suppliers:
  - name: electricity production, photovoltaic, 3kWp slanted-roof installation, single-Si, panel, mounted
    product: electricity, low voltage
    unit: kilowatt hour
    locations:
    - same
    - RoW
    - CH
  conversion: One native kWh per requested kWh; native installation, lifetime, yield and maintenance inputs are
    retained.
  limitations: A conventional single-Si roof generator replaces the reported residential technology mix. Uses the
    native local generator where available, otherwise RoW then CH including that proxy yield; preserving the requested
    location for IAM mapping does not establish local solar yield. Advanced module detail and updated national mixes
    are lost.
  evidence:
  - 'Native ecoinvent 3.12 inventory and reference-product metadata: electricity production, photovoltaic, 3kWp
    slanted-roof installation, single-Si, panel, mounted.'
  - https://ecoinvent.org/ecoinvent-v3-12/
  - https://support.ecoinvent.org/hubfs/Comms/2025%20v3.12%20Release/ecoinvent%20Introduction%20to%20version%203.12%20Webinar%20Q%26A.pdf
  confidence: medium
