PEMFC:
  uvek_aliases:
    clic_slugs:
      - fuel-cell-stack-production-1-kwe-proton-exchange-membrane-pem
    clic_role_key: metals.yaml:PEMFC
    fltr:
      name:
        - Fuel cell stack production, 1 kWe, proton exchange membrane (PEM)
      reference product:
        - Fuel cell stack production, 1 kWe, proton exchange membrane (PEM)
      unit: unit
    exact: true
    exact_identities:
      - name: Fuel cell stack production, 1 kWe, proton exchange membrane (PEM)
        reference product: Fuel cell stack production, 1 kWe, proton exchange membrane (PEM)
        unit: unit
    native_reference_amount: 1
    native_limitations:
      - The native reference provides one 1 kWe PEM stack. Apply the existing kg/MW stack
        intensities with the existing 0.001 MW per unit basis. Balance of plant,
        complete vehicles, membranes, treatment and electricity services are separate
        boundaries and are excluded.
      - Native stacks retain their own technology, material composition,
        geography, allocation, vintage and biosphere limitations. This selector does
        not establish score equivalence or authorize extrapolating unsupported years.
      - Published CLIC stacks enter only through the reviewed metals.yaml:PEMFC
        binding and its positive one-unit reference check, never through native names.
  ecoinvent_aliases:
    # Capacity-based intensities apply to the configured stack, not its materials.
    fltr:
      name: fuel cell stack production, 1 kWe, proton exchange membrane (PEM)
      reference product: fuel cell stack, 1 kWe, proton exchange membrane (PEM)
