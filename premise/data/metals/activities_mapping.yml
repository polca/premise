perovskite:
  uvek_aliases:
    fltr:
      name:
      - Photovoltaic panel, perovskite-Si-tandem, at plant
      reference product:
      - Photovoltaic panel, perovskite-Si-tandem, at plant
      unit: square meter
    exact: true
    exact_identities:
    - name: Photovoltaic panel, perovskite-Si-tandem, at plant
      reference product: Photovoltaic panel, perovskite-Si-tandem, at plant
      unit: square meter
    native_reference_amount: 1
    native_limitations:
    - Preserve the complete native tandem panel. Its ITO is supplied through a shared LCD sputtering service
      measured in m3; the existing perovskite rule requests a direct nanoscale sputtering-target powder.
      Adding powder at the panel would overlap coating burdens, while changing the shared LCD service would
      affect unrelated products. A compatible isolated perovskite coating target is unavailable.
    - All source quantities, signs, reference products, ancillary inputs and unsupported-year/matched-design
      guards remain. Native source biosphere exclusions and unquantified LCIA differences remain.
  ecoinvent_aliases:
    fltr:
      - sputter process
