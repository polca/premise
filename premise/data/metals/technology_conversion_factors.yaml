- id: battery-cell-production-li-ion-nmc111
  activity:
    name: battery cell production, Li-ion, NMC111
  ecoinvent_unit: kilogram
  intensity_unit: kg/kWh
  factor: 0.197
  description: "Reference:\nDai, Q., Kelly, J. C., Gaines, L., & Wang, M. (2019). Life cycle analysis of lithium-ion batteries for automotive applications. Batteries, 5(2), 48.\nThis dataset represents the production of 1 kg of Li-ion battery cell with nickel-manganese-cobalt 111 (NMC111) cathode and graphite-based anode. The specific energy capacity of a cell is 0.197 kWh/kg cell, as reported in Dai et al. (2019). The inventory is modelled according to the publication of Dai et al. (2019) and expert judgement. Infrastructure is included as well. \nGeography:  This dataset covers the geography China, which is the leader country of Li-ion battery cell  production. Data have been partly collected form a Chinese company.\nTechnology:  This dataset includes a method of producing Li-ion cell. Lithium ions move from the cathode (NMC111) into the electrolyte through the micropores of the separator into the graphite anode during the charging phase. During the discharge of the battery, the Li+-ions\
    \ move back into the cathode. \nTime period:  The time period is from 2017 (year of the collection of data) and 2020 (year of the dataset)"
  comment: '-'
