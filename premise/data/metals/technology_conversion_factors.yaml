- id: wind-turbine-construction-2mw-onshore
  activity:
    name: wind turbine construction, 2MW, onshore
  ecoinvent_unit: unit
  intensity_unit: kg/MW
  factor: 2.0
  description: "This dataset represents the construction of a wind turbine with a capacity of 2MW for onshore use. The term \"wind turbine\" inludes moving parts such as nacelle, rotor, rotor blades, transition piece as well as fixed parts such as the tower and the foundation.\n\nThe LCI model is based on the environmental assessment of this turbine in (Elsam 2004a), in which the Danish wind park Tjaerborg with eight turbines of differing capacities is analysed, among them the Vestas V80/2 MW. This type can be taken as reference technology for wind turbines with a capacity between 1 and 3 MW. \nParts of the wind turbine are the following: \n - Rotor: Rotor blades, rotor hub, extender\n - Nacelle: The nacelle consists of the nacelle cover, which includes generator, gear, main shaft, yaw system, flanges etc. \n- Electronics\n - Tower (steel)\n - Foundation \nTechnology:  The Vestas V80/2 MW turbine is chosen as reference technology.\nCharacteristics: \n - Capacity: 2000 kW \n- Diameter of\
    \ the rotor: 80 m\n - Number of rotor blades: 3\n - rotor weight: 37000 kg\n - rotor blade weight: 6500 kg\n - nacelle weight: 61000 kg\n \n - tower type: tubular steel tower\n- tower weight: 165000 kg\n - material of the tower: Steel\n - tower hub height: 78 m\n - tower diameter: 4m\n - foundation weight: 805000\n - cable for network connection (per turbine): 1000 m\n - Lifetime: 20 years\n\nSource: Elsam (2004a) Life Cycle Assessment of offshore and onshore sited wind farms. Elsam Engineering A/S, Fredericia, Denmark \n\nFurther characteristics:\n\nOperational data\nRated power: 2,000 kW\nCut-in wind speed: 4 m/s\nRated wind speed: 16 m/s\nCut-out wind speed: 25 m/s\nWind class: IEC IA and IEC IIA\nOperating temperature range: standard turbine -20°C to 40°C, low temperature turbine -30°C to 40°C\n\nRotor\nRotor diameter: 80 m\nSwept area: 5,027 m2\nNominal revolutions: 16.7 rpm\nOperational interval: 10.8-19.1 rpm\nAir brake: Full blade feathering with three-pitch cylinders\n\nElectrical\n\
    Frequency: 50 Hz/60 Hz\nGenerator type: 4-pole doubly fed generator, slip rings\n\nGearbox\nType: three-stage planetary/helical\n\nPower regulation\nPitch regulated with variable speed\n\nSource: Vestas. 2010. V80-2.0MW. Vestas. Wind. It means the world to us.TM"
  comment: '-'
- id: wind-turbine-construction-2mw-onshore-direct-drive
  activity:
    name: wind turbine construction, 2MW, onshore, direct drive
  ecoinvent_unit: unit
  intensity_unit: kg/MW
  factor: 2.0
- id: wind-turbine-construction-4-5mw-onshore
  activity:
    name: wind turbine construction, 4.5MW, onshore
  ecoinvent_unit: unit
  intensity_unit: kg/MW
  factor: 4.5
  description: "This dataset represents the construction of a wind turbine with a capacity of 4.5MW for onshore use. The term \"wind turbine\" inludes moving parts such as nacelle, rotor, rotor blades, transition piece as well as fixed parts such as the tower and the foundation. \nReference technology for this wind turbine is an Enercon E-112 turbine. The tower is made of reinforced concrete, a relatively new technology. LCI data are based on (Chataignere & Le Boulch 2003), supplemented with some own assumptions and adapted to the ecoinvent background database for this study. Parts of the wind turbine are the following: \n - Rotor: Rotor blades (fibre-glass reinforced plastics), rotor hub, extender\n - Nacelle (gearbox, generator, shaft and others)\n - Electronics\n - Tower\n - Foundation \n\nData are very rough since no real data were available for the tower and foundations mass balance, and since the detailed composition of the nacelle, blades and connection to the grid is derived from\
    \ an Enercon E-66 1.5MW wind turbine. \nTechnology:  Technology: Enercon E-112 4.5MW wind turbine. This special type of wind turbine is not on the market any more, but the technology can still be taken as a good reference for wind turbines with a capacity of >3 MW built today.\n Characteristics: \n - Capacity: 4500 kW\n\n- Diameter of the rotor: 113 m\n - Length of the rotor blades: 52 m\n - Number of rotor blades: 3\n - rotor blade weight: 20000 kg\n\n- nacelle weight: ca.355000 kg\n\n - material of the tubular tower: concrete (+reinforcing steel)\n - tower height: 120 m\n - foundation thickness: 2m\n - cable for network connection (per turbine): 1000 m\n - Lifetime: 20 years \nSource: Chataignere A. and Le Boulch D. (2003) Wind Turbine Systems. Final report ECLIPSE. EDF R&D, Clamart Cedex, France"
  comment: '-'
- id: wind-turbine-construction-4-5mw-onshore-direct-drive
  activity:
    name: wind turbine construction, 4.5MW, onshore, direct drive
  ecoinvent_unit: unit
  intensity_unit: kg/MW
  factor: 4.5
- id: wind-turbine-construction-750kw-onshore
  activity:
    name: wind turbine construction, 750kW, onshore
  ecoinvent_unit: unit
  intensity_unit: kg/MW
  factor: 0.75
  description: "This dataset represents the construction of a wind turbine with a capacity of 750kW for onshore use. The term \"wind turbine\" inludes moving parts such as nacelle, rotor, rotor blades, transition piece as well as fixed parts such as the tower and the foundation.\n\nThe LCI model is based on collected data from the Wind Energy Technocentre in Quebec, that estimated the bill of materials in the different parts ot the turbine. The NEG Micon 750kW/48 has been taken as reference technology for wind turbines with a capacity lower than 1MW. \nSome missing data were completed by extrapolation from 2MW turbine dataset.\n\nParts of the wind turbine are the following: \n - Rotor: Rotor blades, rotor hub, extender\n - Nacelle: The nacelle consists of the nacelle cover, which includes generator, gear, main shaft, yaw system, flanges etc. \n- Electronics\n - Tower (steel)\n - Foundation \nTechnology:  Operational parameters:\nNominal output 750 kW\nPower regulation Stall\nNominal wind\
    \ speed 16 m/s\nCut-in 4 m/s\nCut-out 25 m/s\nRotor:\nRotor diameter 48.2 m\nRotor swept area 1824 m2\nNumber of blades 3\nRotor revolutions 22/15 rpm\nRotor placing Upwind rotor\nBrake system:\nBlade tip air brake Hydraulic, fail-safe\nDisk brake Hydraulic, fail-safe\nDrive train\nGear type Planetary - parallel axle\nRatio 1:67.5\nMain shaft Forged shaft and flange\nMain bearing Spherical roller bearing\nCooling Heat exchanger with pump\nGenerator:\nType Asynchronous, 4/6 pole\nNominal voltage 690 V\nNominal frequence 50 Hz\nName plate rating 750/200 kW\nCooling Liquid-cooled with pump\nYaw system:\nType Ball bearing\nYaw brake 3 Friction brake/motor brake\nDrive mechanism 4 electrical planetary gears\nTower:\nType Conical, steel, painted\nHub height In accordance with approval\nController:\nType Computer controlling\nComputer controlling Soft by thyristors\nCapacitor bank No-load compensated\nRemote control By modem\nWeight:Tower weight 60t\nRotor+Nacelle weight: 30.5 tSource: \nTime\
    \ period:  Turbines present in 2008 in Quebec wind power park. Lifespan of 20 years"
  comment: '-'
