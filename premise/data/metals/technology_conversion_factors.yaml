- id: battery-production-lead-acid-rechargeable-stationary
  activity:
    name: battery production, lead acid, rechargeable, stationary
  ecoinvent_unit: kilogram
  intensity_unit: kg/kWh
  factor: 0.0295
  description: 'No emissions to air or water are taken into account.

    Specific parameters according to model Exide Absolyte (R) GX V-0

    Energy density: 27 Wh/kg (at 8 h discharge), 32 Wh/kg (at 24 h discharge rate)

    DC/DC round trip efficiency: 0.8 cycles to failure: 1200 (at a 8 h discharge rate and DoD of 100 %); 800 (at a 2 h discharge rate and DoD of 71.9 %)

    The inventory was modelled according to: Spanos, Constantine, Turney, Damon E., Fthenakis, Vasilis (2015): Life-cycle analysis of flow-assisted nickel zinc-, manganese dioxide-, and valve-regulated lead-acid batteries designed for demand-charge reduction. Renewable and Sustainable Energy Reviews 43: 478–494. doi:10.1016/j.rser.2014.10.072.

    This dataset represents the production of 1 kg of a valve regulated lead acid (VRLA) battery (absorbed glass matt - AGM) for stationary use. Material composition relates to a specific battery model. Specific parameters according to model Exide Absolyte (R) GX V-0 Energy density: 27 Wh/kg (at 8 h discharge), 32 Wh/kg (at 24 h discharge rate) DC/DC round trip efficiency: 0.8 cycles to failure: 1200 (at a 8 h discharge rate and DoD of 100 %); 800 (at a 2 h discharge rate and DoD of 71.9 %). Energy requirements of electricity, gas and oil comprise the manufacturing of grid, paste, and plate, plastic moulding and assembly/formation. No further direct emissions to air or water are taken into account. The inventory was modelled according to: Spanos, Constantine, Turney, Damon E., Fthenakis, Vasilis (2015): Life-cycle analysis of flow-assisted nickel zinc-, manganese dioxide-, and valve-regulated lead-acid batteries designed for demand-charge reduction. Renewable and Sustainable Energy Reviews
    43: 478–494. doi:10.1016/j.rser.2014.10.072.

    Geography:  Literature source refers to US conditions concerning battery production and parameters.

    Technology:  Includes manufacturing of grid, paste, and plate, plastic moulding, assembly/formation

    Time period:  according to the sources Spanos et al. (2015) cited'
